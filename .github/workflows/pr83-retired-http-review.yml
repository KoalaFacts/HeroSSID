name: Independent PR83 retired issuer exact-JWT candidate review

on:
  push:
    branches:
      - review/pr83-retired-jwt-http-20261101

permissions: {}

jobs:
  review:
    name: Independent Qwen review of six retired-key HTTP patches
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout pinned candidate and helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable candidate and complete six-file diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 5f5f3f94bf83eda436559d53b269131694b694e7^{commit})" = "5f5f3f94bf83eda436559d53b269131694b694e7"
          test "$(git rev-parse 81f14014b60d7068b1c71e60d4e0661a49f32379^{commit})" = "81f14014b60d7068b1c71e60d4e0661a49f32379"
          test "$(git diff --name-only 81f14014b60d7068b1c71e60d4e0661a49f32379 5f5f3f94bf83eda436559d53b269131694b694e7 | wc -l)" -eq 6
      - name: Install local independent code review model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Review part 1 of 2 (real source patches, not a mock)
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_PART=1 python3 tools/offline_pr83_review.py
          test -s review-1.md
          test -s review-1.json
          test -s review-model-1.json
          test "$(cat review-head-1.txt)" = "5f5f3f94bf83eda436559d53b269131694b694e7"
      - name: Review part 2 of 2 (full remaining source patches)
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_PART=2 python3 tools/offline_pr83_review.py
          test -s review-2.md
          test -s review-2.json
          test -s review-model-2.json
          test "$(cat review-head-2.txt)" = "5f5f3f94bf83eda436559d53b269131694b694e7"
      - name: Retain independent raw model results and exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr83-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Submit independent exact-head COMMENTED review, not approval
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download actual independent model artifacts
        uses: actions/download-artifact@v4
        with:
          name: independent-pr83-review
      - name: Verify exact head and that all four changed files were inspected
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/83 --jq '.head.sha')"
          test "$actual" = "5f5f3f94bf83eda436559d53b269131694b694e7"
          python3 - <<'PY'
          import json
          from pathlib import Path
          head = "5f5f3f94bf83eda436559d53b269131694b694e7"
          expected = {
            "README.md",
            "docs/jwt-vc-json-retired-issuer-http-profile.md",
            "src/Services/HeroSSID.Api/Features/Credentials/CredentialEndpoints.cs",
            "src/Services/HeroSSID.Api/Features/Credentials/JwtVcJsonRetiredIssuerVerificationEndpoint.cs",
            "tests/Contract/HeroSSID.OpenID4VC.Contract.Tests/JwtVcJsonCredentialVerificationHttpTests.cs",
            "tests/Unit/HeroSSID.Api.Tests/JwtVcJsonRetiredIssuerHttpRouteTests.cs",
          }
          seen = []
          for part in (1, 2):
              data = json.loads(Path(f"review-{part}.json").read_text())
              raw = json.loads(Path(f"review-model-{part}.json").read_text())
              assert data["head"] == head and data["part"] == part
              assert data["review"]["verdict"] == raw["verdict"]
              assert raw["verdict"] in ("no_actionable_findings", "actionable_findings", "inconclusive")
              assert len(Path(f"review-{part}.md").read_text()) > 200
              assert Path(f"review-head-{part}.txt").read_text().strip() == head
              seen.extend(data["files"])
          assert len(seen) == len(expected) and set(seen) == expected, (seen, expected)
          PY
      - name: Submit model's actual verdicts and findings to GitHub PR83
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent Qwen2.5-Coder 7B security/code review of ALL SIX changed PR #83 retired-key exact-JWT trust files.'
            echo
            echo 'Reviewed exact source head: 5f5f3f94bf83eda436559d53b269131694b694e7.'
            echo 'Baseline: 81f14014b60d7068b1c71e60d4e0661a49f32379.'
            echo 'Model execution, NOT human approval, independent wallet conformance or external cryptographic certification.'
            echo 'Every finding requires itemized source/test reconciliation before merge.'
            echo
            cat review-1.md
            echo
            cat review-2.md
          } >/tmp/pr83-independent-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/83/reviews \
            -f event=COMMENT -f commit_id=5f5f3f94bf83eda436559d53b269131694b694e7 \
            -f body="$(cat /tmp/pr83-independent-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
