name: Independent PR90 authenticated VC1.1 status cutoff review

on:
  push:
    branches:
      - review/pr90-vc11-status-cutoff-20261101

permissions: {}

jobs:
  review:
    name: Independent Qwen two-part exact-head VC1.1 status cutoff security review
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout independent review helper and immutable candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate pinned candidate and all nine changed files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 889b9c91b5381c793521b549b6f67549e0693bb9^{commit})" = "889b9c91b5381c793521b549b6f67549e0693bb9"
          test "$(git rev-parse f6f4a3922d5ce94710c1c937dc892cc48c935879^{commit})" = "f6f4a3922d5ce94710c1c937dc892cc48c935879"
          test "$(git diff --name-only f6f4a3922d5ce94710c1c937dc892cc48c935879 889b9c91b5381c793521b549b6f67549e0693bb9 | wc -l)" -eq 9
      - name: Install independent local model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Independent model review part 1
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_PART=1 python3 tools/offline_pr90_review.py
          test -s review-1.md
          test -s review-1.json
          test -s review-model-1.json
          test "$(cat review-head-1.txt)" = "889b9c91b5381c793521b549b6f67549e0693bb9"
      - name: Independent model review part 2
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_PART=2 python3 tools/offline_pr90_review.py
          test -s review-2.md
          test -s review-2.json
          test -s review-model-2.json
          test "$(cat review-head-2.txt)" = "889b9c91b5381c793521b549b6f67549e0693bb9"
      - name: Preserve full original model results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr90-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          retention-days: 30
          if-no-files-found: warn

  publish:
    name: Submit actual exact-head independent COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download original model output without rerunning model
        uses: actions/download-artifact@v4
        with:
          name: independent-pr90-review
      - name: Verify PR90 head and all nine changed source/doc/test files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/89 --jq '.head.sha')"
          test "$actual" = "889b9c91b5381c793521b549b6f67549e0693bb9"
          gh api repos/KoalaFacts/HeroSSID/pulls/89/files --paginate --jq '.[].filename' | sort >/tmp/pr90-actual-files.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_head = "889b9c91b5381c793521b549b6f67549e0693bb9"
          expected = {
              "docs/jwt-vc-json-http-verify-profile.md",
              "docs/jwt-vc-json-offline-trusted-issuer-profile.md",
              "src/Libraries/HeroSSID.Credentials/JwtVcJson/JwtVcJsonRevocationSnapshot.cs",
              "src/Libraries/HeroSSID.Credentials/JwtVcJson/JwtVcJsonTrustedIssuerVerifier.cs",
              "src/Services/HeroSSID.Api/Features/Credentials/JwtVcJsonCredentialVerificationEndpoint.cs",
              "src/Services/HeroSSID.Api/Features/Credentials/JwtVcJsonTrustedIssuerVerificationEndpoint.cs",
              "tests/Contract/HeroSSID.OpenID4VC.Contract.Tests/JwtVcJsonCredentialVerificationHttpTests.cs",
              "tests/Unit/HeroSSID.Api.Tests/JwtVcJsonTrustedIssuerVerificationEndpointTests.cs",
              "tests/Unit/HeroSSID.Credentials.Tests/JwtVcJsonTrustedIssuerVerifierTests.cs",
          }
          assert set(Path("/tmp/pr90-actual-files.txt").read_text().splitlines()) == expected
          seen = []
          for part in (1, 2):
              data = json.loads(Path(f"review-{part}.json").read_text())
              raw = json.loads(Path(f"review-model-{part}.json").read_text())
              assert data["head"] == expected_head and data["part"] == part
              assert data["review"]["verdict"] == raw["verdict"]
              assert raw["verdict"] in ("no_actionable_findings", "actionable_findings", "inconclusive")
              assert len(Path(f"review-{part}.md").read_text()) > 200
              assert Path(f"review-head-{part}.txt").read_text().strip() == expected_head
              seen.extend(data["files"])
          assert len(seen) == len(expected) and set(seen) == expected
          PY
      - name: Publish raw truthful verdict and findings to PR90
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "Independent Qwen2.5-Coder 7B review of ALL NINE changed PR #90 authenticated direct VC1.1 status-cutoff files."
            echo
            echo "Reviewed exact HEAD: 889b9c91b5381c793521b549b6f67549e0693bb9."
            echo "Base: f6f4a3922d5ce94710c1c937dc892cc48c935879."
            echo "Automated local model review, NOT human approval, wallet conformance or external cryptographic audit."
            echo "All findings require itemized source/test disposition before merge."
            echo
            cat review-1.md
            echo
            cat review-2.md
          } >/tmp/pr90-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/89/reviews \
            -f event=COMMENT -f commit_id=889b9c91b5381c793521b549b6f67549e0693bb9 \
            -f body="$(cat /tmp/pr90-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
