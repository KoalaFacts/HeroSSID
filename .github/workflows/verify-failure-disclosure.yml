name: Focused non-PostgreSQL verification (not full CI)

on: create

permissions:
  contents: read

jobs:
  non_database_verification:
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'verify/failure-disclosure-')
    name: '${{ matrix.phase }} - non-PostgreSQL suites'
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: baseline-expected-disclosure-failures
            source: fc82b3b2b4e66255b82ca11add9bb6d4b6da75e4
          - phase: fixed-candidate
            source: e81f18496a984ab8dc51982169f620bb69991a83
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ matrix.source }}'
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Confirm exact source under test
        env:
          EXPECTED_SOURCE: '${{ matrix.source }}'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git log -1 --format='%H %s'
          echo 'Only non-PostgreSQL suites run here. This is NOT full CI or permission to merge.'
      - name: Restore and build Release without changing warning policies
        run: |
          dotnet restore HeroSSID.sln
          dotnet build HeroSSID.sln --configuration Release --no-restore
      - name: Run every non-PostgreSQL suite and preserve all failures
        shell: bash
        run: |
          failed=0
          projects=(
            tests/Unit/HeroSSID.Unit.Tests/HeroSSID.Unit.Tests.csproj
            tests/Unit/HeroSSID.Api.Tests/HeroSSID.Api.Tests.csproj
            tests/Unit/HeroSSID.Data.Tests/HeroSSID.Data.Tests.csproj
            tests/Unit/HeroSSID.DidOperations.Tests/HeroSSID.DidOperations.Tests.csproj
            tests/Contract/HeroSSID.DidOperations.Contract.Tests/HeroSSID.DidOperations.Contract.Tests.csproj
            tests/Unit/HeroSSID.Credentials.Tests/HeroSSID.Credentials.Tests.csproj
          )
          for project in "${projects[@]}"; do
            dotnet test "$project" --configuration Release --no-build --no-restore \
              --logger 'trx;LogFileName=results.trx' --verbosity normal || failed=1
          done
          exit "$failed"
      - name: Upload exact test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: '${{ matrix.phase }}-non-postgresql-results'
          path: '**/TestResults/*.trx'
          retention-days: 7
