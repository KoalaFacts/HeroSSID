name: Independent PR81 VC1.1 Wallet status preflight exact-head review

on:
  push:
    branches:
      - review/pr81-vc11-wallet-status-20261101

permissions: {}

jobs:
  review:
    name: Independent Qwen review of four original VC1.1 Wallet status patches
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout pinned candidate and helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable candidate and complete four-file diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse b3bb183950dc70035cdd9e3aef63dbd0fdf5f386^{commit})" = "b3bb183950dc70035cdd9e3aef63dbd0fdf5f386"
          test "$(git rev-parse f06fa7c6d11ef772bc7d74445fd3fcd9b538a16a^{commit})" = "f06fa7c6d11ef772bc7d74445fd3fcd9b538a16a"
          test "$(git diff --name-only f06fa7c6d11ef772bc7d74445fd3fcd9b538a16a b3bb183950dc70035cdd9e3aef63dbd0fdf5f386 | wc -l)" -eq 4
      - name: Install local independent code review model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Review part 1 of 2 (real source patches, not a mock)
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_PART=1 python3 tools/offline_pr81_review.py
          test -s review-1.md
          test -s review-1.json
          test -s review-model-1.json
          test "$(cat review-head-1.txt)" = "b3bb183950dc70035cdd9e3aef63dbd0fdf5f386"
      - name: Review part 2 of 2 (full remaining source patches)
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_PART=2 python3 tools/offline_pr81_review.py
          test -s review-2.md
          test -s review-2.json
          test -s review-model-2.json
          test "$(cat review-head-2.txt)" = "b3bb183950dc70035cdd9e3aef63dbd0fdf5f386"
      - name: Retain independent raw model results and exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr81-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Submit independent exact-head COMMENTED review, not approval
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download actual independent model artifacts
        uses: actions/download-artifact@v4
        with:
          name: independent-pr81-review
      - name: Verify exact head and that all four changed files were inspected
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/81 --jq '.head.sha')"
          test "$actual" = "b3bb183950dc70035cdd9e3aef63dbd0fdf5f386"
          python3 - <<'PY'
          import json
          from pathlib import Path
          head = "b3bb183950dc70035cdd9e3aef63dbd0fdf5f386"
          expected = {
            "README.md",
            "docs/jwt-vc-json-wallet-disclosure-preflight.md",
            "src/Libraries/HeroSSID.Credentials/VerifiablePresentations/OpenId4VpJwtVcJsonWalletDisclosure.cs",
            "tests/Unit/HeroSSID.Credentials.Tests/OpenId4VpJwtVcJsonWalletDisclosureTests.cs",
          }
          seen = []
          for part in (1, 2):
              data = json.loads(Path(f"review-{part}.json").read_text())
              raw = json.loads(Path(f"review-model-{part}.json").read_text())
              assert data["head"] == head and data["part"] == part
              assert data["review"]["verdict"] == raw["verdict"]
              assert raw["verdict"] in ("no_actionable_findings", "actionable_findings", "inconclusive")
              assert len(Path(f"review-{part}.md").read_text()) > 200
              assert Path(f"review-head-{part}.txt").read_text().strip() == head
              seen.extend(data["files"])
          assert len(seen) == len(expected) and set(seen) == expected, (seen, expected)
          PY
      - name: Submit model's actual verdicts and findings to GitHub PR81
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent Qwen2.5-Coder 7B security/code review of ALL FOUR changed PR #81 status-aware VC1.1 Wallet preflight and signing files.'
            echo
            echo 'Reviewed exact source head: b3bb183950dc70035cdd9e3aef63dbd0fdf5f386.'
            echo 'Baseline: f06fa7c6d11ef772bc7d74445fd3fcd9b538a16a.'
            echo 'Model execution, NOT human approval, independent wallet conformance or external cryptographic certification.'
            echo 'Every finding requires itemized source/test reconciliation before merge.'
            echo
            cat review-1.md
            echo
            cat review-2.md
          } >/tmp/pr81-independent-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/81/reviews \
            -f event=COMMENT -f commit_id=b3bb183950dc70035cdd9e3aef63dbd0fdf5f386 \
            -f body="$(cat /tmp/pr81-independent-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
