name: Independent exact-head PR73 VC2 signed-policy HTTP verification review

on:
  push:
    branches:
      - review/pr73-vc2-jose-content-type-20261031

permissions: {}

jobs:
  review:
    name: Independent model security review of complete nine-file VC2 signed-policy HTTP verification patch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout pinned candidate and helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable source and complete nine-file diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse c1dca10b46f6c681b8a3649cd55b42124ea36a18^{commit})" = "c1dca10b46f6c681b8a3649cd55b42124ea36a18"
          test "$(git rev-parse bb606576888e37631ee1e513294109564f16c40d^{commit})" = "bb606576888e37631ee1e513294109564f16c40d"
          test "$(git diff --name-only bb606576888e37631ee1e513294109564f16c40d c1dca10b46f6c681b8a3649cd55b42124ea36a18 | wc -l)" -eq 9
      - name: Install independent local model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Independently inspect all nine JOSE content-type source test and documentation patches
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_PART=1 python3 tools/offline_pr73_review.py
          REVIEW_PART=2 python3 tools/offline_pr73_review.py
          for part in 1 2; do
            test -s "review-$part.md"
            test -s "review-$part.json"
            test -s "review-model-$part.json"
            test "$(cat "review-head-$part.txt")" = "c1dca10b46f6c681b8a3649cd55b42124ea36a18"
          done
      - name: Retain raw model artifact and exact-head provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr73-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Submit exact-head independent COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download raw review and structured findings
        uses: actions/download-artifact@v4
        with:
          name: independent-pr73-review
      - name: Verify PR head and exact nine-file model coverage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/73 --jq '.head.sha')"
          test "$actual" = "c1dca10b46f6c681b8a3649cd55b42124ea36a18"
          python3 - <<'PY'
          import json
          from pathlib import Path
          head = "c1dca10b46f6c681b8a3649cd55b42124ea36a18"
          expected = {
            "docs/vcdm20-jose-presentation-profile.md",
            "docs/vcdm20-jose-profile.md",
            "src/Libraries/HeroSSID.Credentials/Utilities/StrictJwtReader.cs",
            "src/Libraries/HeroSSID.Credentials/Vcdm20/Vcdm20JoseCredential.cs",
            "src/Libraries/HeroSSID.Credentials/Vcdm20/Vcdm20JosePresentation.cs",
            "src/Libraries/HeroSSID.Credentials/Vcdm20/Vcdm20RevocationSnapshot.cs",
            "tests/Unit/HeroSSID.Credentials.Tests/Vcdm20JoseCredentialTests.cs",
            "tests/Unit/HeroSSID.Credentials.Tests/Vcdm20JosePresentationTests.cs",
            "tests/Unit/HeroSSID.Credentials.Tests/Vcdm20RevocationSnapshotTests.cs",
          }
          examined = []
          for part in (1, 2):
            result = json.loads(Path(f"review-{part}.json").read_text())
            raw = json.loads(Path(f"review-model-{part}.json").read_text())
            assert result["head"] == head and result["part"] == part
            assert result["review"]["verdict"] == raw["verdict"]
            assert raw["verdict"] in ("no_actionable_findings", "actionable_findings", "inconclusive")
            assert len(Path(f"review-{part}.md").read_text()) > 200
            assert Path(f"review-head-{part}.txt").read_text().strip() == head
            examined.extend(result["files"])
          assert len(examined) == len(expected), (len(examined), len(expected))
          assert set(examined) == expected, set(examined) ^ expected
          PY
      - name: Submit independent model findings without claiming human approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent Qwen2.5-Coder 7B security/code review of all nine changed PR #73 VC2 signed verifier request-policy files.'
            echo
            echo 'Reviewed exact head: c1dca10b46f6c681b8a3649cd55b42124ea36a18.'
            echo 'Baseline: bb606576888e37631ee1e513294109564f16c40d.'
            echo 'This is a submitted independent MODEL review, not human approval or external cryptographic certification.'
            echo 'All findings require explicit source/test verification before merge.'
            echo
            cat review-1.md
            printf "\n\n"
            cat review-2.md
          } > /tmp/pr73-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/73/reviews \
            -f event=COMMENT -f commit_id=c1dca10b46f6c681b8a3649cd55b42124ea36a18 \
            -f body="$(cat /tmp/pr73-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
