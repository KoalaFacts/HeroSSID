name: Publish verified independent PR36 review evidence
on:
  push:
    branches:
      - review/pr36-offline-20261029

permissions: {}

jobs:
  publish:
    name: Submit verified independent model COMMENTED review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Download complete model review
        uses: actions/download-artifact@v4
        with:
          name: independent-pr36-review
          run-id: 40875744138
          github-token: ${{ github.token }}
      - name: Verify changed files, model evidence and unchanged PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/36 --jq '.head.sha')"
          test "$actual" = "c1ff7f523375b4178f47125f39c16de829deeeb2"
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_head = "c1ff7f523375b4178f47125f39c16de829deeeb2"
          expected_files = {
              "src/Libraries/HeroSSID.Credentials/VerifiablePresentations/OfflinePresentationCreator.cs",
              "tests/Unit/HeroSSID.Credentials.Tests/OfflinePresentationCreatorTests.cs",
              "docs/presentation-profile.md",
              "README.md",
          }
          seen = set()
          for part in (1, 2):
              payload = json.loads(Path(f"review-{part}.json").read_text())
              assert payload["head"] == expected_head
              assert payload["part"] == part
              files = set(payload["files"])
              assert files and files.isdisjoint(seen)
              seen.update(files)
              assert payload["review"]["verdict"] in (
                  "no_actionable_findings", "actionable_findings", "inconclusive"
              )
              assert Path(f"review-model-{part}.json").stat().st_size > 20
              assert Path(f"review-{part}.md").stat().st_size > 200
          assert seen == expected_files
          PY
      - name: Publish COMMENTED review (not APPROVED)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent local Qwen2.5-Coder 7B automated code review of PR #36.'
            echo
            echo 'Exact source: c1ff7f523375b4178f47125f39c16de829deeeb2. Baseline: 448d222d4914ad8a5afa83d522405d50493ee186.'
            echo 'This is NOT human approval, an external audit or independent wallet conformance.'
            echo 'Investigate every finding against the actual source and tests before merge.'
            echo
            cat review-1.md
            echo
            cat review-2.md
            echo
          } > /tmp/pr36-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/36/reviews \
            -f event=COMMENT -f commit_id="c1ff7f523375b4178f47125f39c16de829deeeb2" \
            -f body="$(cat /tmp/pr36-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
