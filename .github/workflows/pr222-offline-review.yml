name: One-off independent offline PR222 review
on:
  push:
    branches:
      - review/pr222-offline-20261107

permissions: {}

jobs:
  review:
    name: Independent Qwen model review of exact PR222 code
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout independent helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact PR head, baseline and three-file scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin feat/didweb-verifier-status-https-admission-20261107:refs/remotes/origin/pr222-reviewed-source
          test "$(gh api repos/KoalaFacts/HeroSSID/pulls/222 --jq '.head.sha')" = "c94dbc3e7bfa05ed81ae266bb209f51ae7a9c0f0"
          test "$(git rev-parse c94dbc3e7bfa05ed81ae266bb209f51ae7a9c0f0^{commit})" = "c94dbc3e7bfa05ed81ae266bb209f51ae7a9c0f0"
          test "$(git rev-parse e44130c45542563419c90f91ba321d9d17f62cdb^{commit})" = "e44130c45542563419c90f91ba321d9d17f62cdb"
          test "$(git diff --name-only e44130c45542563419c90f91ba321d9d17f62cdb c94dbc3e7bfa05ed81ae266bb209f51ae7a9c0f0 | wc -l)" -eq 3
      - name: Install isolated independent local model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Independently evaluate all three exact-head file patches in two shards
        shell: bash
        run: |
          set -euo pipefail
          for part in 1 2; do
            REVIEW_PART="$part" python3 tools/offline_pr222_review.py
            test -s "review-$part.md"
            test -s "review-$part.json"
            test "$(cat review-head-$part.txt)" = "c94dbc3e7bfa05ed81ae266bb209f51ae7a9c0f0"
          done
      - name: Preserve complete raw findings and model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr222-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Submit verified independent model COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download both complete model review shards
        uses: actions/download-artifact@v4
        with:
          name: independent-pr222-review
      - name: Verify complete coverage and exact unchanged PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/222 --jq '.head.sha')"
          test "$actual" = "c94dbc3e7bfa05ed81ae266bb209f51ae7a9c0f0"
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_head = "c94dbc3e7bfa05ed81ae266bb209f51ae7a9c0f0"
          expected_files = {
              "docs/did-web-verifier-online-status-admission.md",
              "src/Libraries/HeroSSID.Credentials/JwtVcJson/JwtVcJsonPinnedDidWebOnlineAdmission.cs",
              "tests/Unit/HeroSSID.Credentials.Tests/JwtVcJsonPinnedDidWebOnlineAdmissionTests.cs",
          }
          seen = set()
          for part in (1, 2):
              payload = json.loads(Path(f"review-{part}.json").read_text())
              assert payload["head"] == expected_head
              assert payload["part"] == part
              files = set(payload["files"])
              assert files and files.isdisjoint(seen)
              seen.update(files)
              assert payload["review"]["verdict"] in (
                  "no_actionable_findings", "actionable_findings", "inconclusive"
              )
              assert Path(f"review-model-{part}.json").stat().st_size > 20
              assert Path(f"review-{part}.md").stat().st_size > 200
          assert seen == expected_files, (seen, expected_files)
          PY
      - name: Post COMMENTED review (not approval)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent local Qwen2.5-Coder 7B automated full-source review of PR #222.'
            echo
            echo 'Exact source: c94dbc3e7bfa05ed81ae266bb209f51ae7a9c0f0. Baseline: e44130c45542563419c90f91ba321d9d17f62cdb.'
            echo 'Model findings require actual source/test disposition. This is NOT human approval, external audit or wallet conformance.'
            echo
            cat review-1.md
            echo
            cat review-2.md
            echo
          } > /tmp/pr222-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/222/reviews \
            -f event=COMMENT -f commit_id="c94dbc3e7bfa05ed81ae266bb209f51ae7a9c0f0" \
            -f body="$(cat /tmp/pr222-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
