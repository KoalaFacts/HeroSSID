name: One-off independent offline PR256 VC2 direct did:key holder VC2 proof review
on:
  push:
    branches:
      - review/pr256-vc2-didkey-holder-20261109

permissions: {}

jobs:
  publish:
    name: Submit exact-head independent COMMENTED review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Download independently completed model artifacts
        uses: actions/download-artifact@v4
        with:
          name: independent-pr256-review
          run-id: 42572903756
          github-token: ${{ github.token }}
      - name: Verify exact PR256 HEAD and full 5-file model coverage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/KoalaFacts/HeroSSID/pulls/256 --jq '.head.sha')" = "29228b96147d52425bdfd212f7d1c1e0210b5ac6"
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_head = "29228b96147d52425bdfd212f7d1c1e0210b5ac6"
          expected_files = {
              "README.md",
              "docs/cli-vc2-didkey-holder.md",
              "src/Cli/HeroSSID.Cli/Commands/CredentialCommands.Vc2DidKeyHolder.cs",
              "src/Cli/HeroSSID.Cli/Commands/CredentialCommands.cs",
              "tests/Unit/HeroSSID.Credentials.Tests/CredentialCliVc2DidKeyHolderTests.cs",
          }
          seen = set()
          for part in (1, 2):
              payload = json.loads(Path(f"review-{part}.json").read_text())
              assert payload["head"] == expected_head and payload["part"] == part
              files = set(payload["files"])
              assert files and files.isdisjoint(seen)
              seen.update(files)
              assert payload["review"]["verdict"] in (
                  "no_actionable_findings", "actionable_findings", "inconclusive"
              )
              assert Path(f"review-model-{part}.json").stat().st_size > 20
              assert Path(f"review-{part}.md").stat().st_size > 200
          assert seen == expected_files
          PY
      - name: Publish real COMMENTED review without approval claim
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent local Qwen2.5-Coder 7B automated code review of PR #256.'
            echo
            echo 'Exact source: 29228b96147d52425bdfd212f7d1c1e0210b5ac6. Baseline: a39bb3fb92b8b2cbb4d468dbc644bcfa9af8ccf9.'
            echo 'Not human approval, third-party Wallet interoperability or an external security audit.'
            echo 'Each finding must be checked against actual source and tests before merge.'
            echo
            cat review-1.md
            echo
            cat review-2.md
          } > /tmp/pr256-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/256/reviews \
            -f event=COMMENT -f commit_id="29228b96147d52425bdfd212f7d1c1e0210b5ac6" \
            -f body="$(cat /tmp/pr256-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
