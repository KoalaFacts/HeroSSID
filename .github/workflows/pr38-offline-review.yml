name: Publish pinned independent offline PR38 review (completed model evidence)
on:
  push:
    branches:
      - review/pr38-offline-20261030

permissions: {}

jobs:
  publish:
    name: Submit verified existing Qwen model COMMENTED review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Download completed immutable original review artifact
        uses: actions/download-artifact@v4
        with:
          name: independent-pr38-review
          run-id: 40894582868
          repository: KoalaFacts/HeroSSID
          github-token: ${{ github.token }}
      - name: Verify changed files, model evidence and unchanged PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/38 --jq '.head.sha')"
          test "$actual" = "92da899e4d3a667e9dbd2c695ffc5fb333b36d81"
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_head = "92da899e4d3a667e9dbd2c695ffc5fb333b36d81"
          expected_files = {
              "README.md",
              "docs/openid4vp-direct-post-profile.md",
              "src/Libraries/HeroSSID.Credentials/Utilities/StrictJwtReader.cs",
              "src/Libraries/HeroSSID.Credentials/VerifiablePresentations/OfflinePresentationVerifier.cs",
              "src/Libraries/HeroSSID.Credentials/VerifiablePresentations/OpenId4VpDirectPost.cs",
              "tests/Unit/HeroSSID.Credentials.Tests/OpenId4VpDirectPostTests.cs",
          }
          seen = set()
          for part in (1, 2):
              payload = json.loads(Path(f"review-{part}.json").read_text())
              assert payload["head"] == expected_head
              assert payload["part"] == part
              files = set(payload["files"])
              assert files and files.isdisjoint(seen)
              seen.update(files)
              assert payload["review"]["verdict"] in (
                  "no_actionable_findings", "actionable_findings", "inconclusive"
              )
              assert Path(f"review-model-{part}.json").stat().st_size > 20
              assert Path(f"review-{part}.md").stat().st_size > 200
          assert seen == expected_files
          PY
      - name: Publish COMMENTED review (not APPROVED)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent local Qwen2.5-Coder 7B automated code review of PR #38.'
            echo
            echo 'Exact source: 92da899e4d3a667e9dbd2c695ffc5fb333b36d81. Baseline: e291cd4c46b0d89bd009a597bc44a2d8e2fae9a3.'
            echo 'This is NOT human approval, an external audit or independent wallet conformance.'
            echo 'Investigate every finding against the actual source and tests before merge.'
            echo
            cat review-1.md
            echo
            cat review-2.md
            echo
          } > /tmp/pr38-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/38/reviews \
            -f event=COMMENT -f commit_id="92da899e4d3a667e9dbd2c695ffc5fb333b36d81" \
            -f body="$(cat /tmp/pr38-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
