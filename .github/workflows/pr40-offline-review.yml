name: Publish preserved independent PR40 model review
on:
  push:
    branches:
      - review/pr40-offline-20261030

permissions: {}

jobs:
  publish:
    name: Submit original pinned Qwen findings without repeat inference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Download original raw model evidence from completed run
        uses: actions/download-artifact@v4
        with:
          run-id: 40923380239
          name: independent-pr40-review
          github-token: ${{ github.token }}
      - name: Validate exact source, original model findings and publish COMMENTED review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/KoalaFacts/HeroSSID/pulls/40 --jq '.head.sha')" = "542ecb14d409da1b9830f1b993ff8e68a35248ee"
          test "$(gh api repos/KoalaFacts/HeroSSID/pulls/40 --jq '.base.sha')" = "c5aef7651d3c55b30be578b7174a81cbf7114be5"
          test "$(gh api repos/KoalaFacts/HeroSSID/pulls/40/reviews --jq 'length')" = 0
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          repo = "repos/KoalaFacts/HeroSSID"
          head = "542ecb14d409da1b9830f1b993ff8e68a35248ee"
          expected = {
              "README.md",
              "docs/vcdm20-jose-presentation-profile.md",
              "src/Libraries/HeroSSID.Credentials/Vcdm20/Vcdm20JosePresentation.cs",
              "tests/Unit/HeroSSID.Credentials.Tests/Vcdm20JosePresentationTests.cs",
          }
          actual = json.loads(subprocess.check_output(
              ["gh", "api", f"{repo}/pulls/40/files"], text=True))
          assert {item["filename"] for item in actual} == expected
          assert len(actual) == len(expected)
          part1 = json.loads(Path("review-1.json").read_text())
          assert part1["head"] == head and part1["part"] == 1
          assert part1["files"] == ["src/Libraries/HeroSSID.Credentials/Vcdm20/Vcdm20JosePresentation.cs"]
          raw1 = json.loads(Path("review-model-1.json").read_text())
          raw2 = json.loads(Path("review-model-2.json").read_text())
          assert part1["review"] == raw1
          assert set(part1["files"]) | {
              "README.md", "docs/vcdm20-jose-presentation-profile.md",
              "tests/Unit/HeroSSID.Credentials.Tests/Vcdm20JosePresentationTests.cs"
          } == expected
          lines = [
              "Independent Qwen2.5-Coder 7B review of exact HeroSSID PR #40 source.",
              "Pinned source: " + head,
              "Pinned base: c5aef7651d3c55b30be578b7174a81cbf7114be5.",
              "Original independent inference: https://github.com/KoalaFacts/HeroSSID/actions/runs/40923380239",
              "Original raw JSON artifact: https://github.com/KoalaFacts/HeroSSID/actions/runs/40923380239/artifacts/12921295357",
              "Publication is a faithful recovery from the original run, not a new model run, human APPROVAL, external audit or wallet conformance.",
              "",
          ]
          for i, (raw, files) in enumerate((
              (raw1, set(part1["files"])),
              (raw2, expected - set(part1["files"])),
          ), start=1):
              assert isinstance(raw["overview"], str) and raw["overview"].strip()
              assert raw["verdict"] in ("inconclusive", "actionable_findings", "no_actionable_findings")
              findings = raw["findings"]
              assert isinstance(findings, list) and len(findings) <= 4
              for finding in findings:
                  assert finding["path"] in files
                  assert finding["severity"] in ("blocker", "major", "minor")
                  assert all(str(finding[x]).strip() for x in ("line_or_hunk", "issue", "verification"))
              contradictory = bool(findings) and raw["verdict"] == "no_actionable_findings"
              lines.extend([
                  f"### Original independent model pass {i}/2",
                  "Files reviewed: " + ", ".join(sorted(files)),
                  "Raw verdict (unchanged): " + raw["verdict"],
                  "Review interpretation: INCONCLUSIVE because raw verdict conflicts with listed findings."
                      if contradictory else "Review interpretation: " + raw["verdict"],
                  "Model overview: " + raw["overview"],
                  "",
              ])
              for j, finding in enumerate(findings, start=1):
                  lines.extend([
                      f"{j}. [{finding['severity']}] {finding['path']} ({finding['line_or_hunk']}): {finding['issue']}",
                      "   Proposed verification: " + finding["verification"],
                  ])
              lines.append("")
          Path("/tmp/pr40-reviewed-model.md").write_text("\n".join(lines))
          PY
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/40/reviews \
            -f event=COMMENT \
            -f commit_id=542ecb14d409da1b9830f1b993ff8e68a35248ee \
            -f body="$(cat /tmp/pr40-reviewed-model.md)" \
            --jq '{id: .id, state: .state, commit_id: .commit_id, submitted_at: .submitted_at}'
