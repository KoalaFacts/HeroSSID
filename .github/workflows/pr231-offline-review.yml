name: One-off independent offline PR231 review
on:
  push:
    branches:
      - review/pr231-offline-20261108

permissions: {}

jobs:
  review:
    name: Independent Qwen model review of exact PR231 code
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout independent helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact PR head, baseline and six-file scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin feat/vc2-pinned-didweb-issuer-20261108:refs/remotes/origin/pr231-reviewed-source
          test "$(gh api repos/KoalaFacts/HeroSSID/pulls/231 --jq '.head.sha')" = "e37506c37ff92d16b0a4e6ee7d1a2b89f78da859"
          test "$(git rev-parse e37506c37ff92d16b0a4e6ee7d1a2b89f78da859^{commit})" = "e37506c37ff92d16b0a4e6ee7d1a2b89f78da859"
          test "$(git rev-parse f810b7591771c109198513dffb6539181a9a453a^{commit})" = "f810b7591771c109198513dffb6539181a9a453a"
          test "$(git diff --name-only f810b7591771c109198513dffb6539181a9a453a e37506c37ff92d16b0a4e6ee7d1a2b89f78da859 | wc -l)" -eq 6
      - name: Install isolated independent local model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Independently evaluate all six exact-head file patches in two shards
        shell: bash
        run: |
          set -euo pipefail
          for part in 1 2; do
            REVIEW_PART="$part" python3 tools/offline_pr231_review.py
            test -s "review-$part.md"
            test -s "review-$part.json"
            test "$(cat review-head-$part.txt)" = "e37506c37ff92d16b0a4e6ee7d1a2b89f78da859"
          done
      - name: Preserve complete raw findings and model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr231-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Submit verified independent model COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download both complete model review shards
        uses: actions/download-artifact@v4
        with:
          name: independent-pr231-review
      - name: Verify complete coverage and exact unchanged PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/231 --jq '.head.sha')"
          test "$actual" = "e37506c37ff92d16b0a4e6ee7d1a2b89f78da859"
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_head = "e37506c37ff92d16b0a4e6ee7d1a2b89f78da859"
          expected_files = {
              "README.md",
              "docs/cli-vc2-didweb-issuer-check.md",
              "src/Cli/HeroSSID.Cli/Commands/CredentialCommands.cs",
              "src/Libraries/HeroSSID.Credentials/Vcdm20/Vcdm20JoseCredential.cs",
              "src/Libraries/HeroSSID.Credentials/Vcdm20/Vcdm20PinnedDidWebIssuer.cs",
              "tests/Unit/HeroSSID.Credentials.Tests/Vcdm20PinnedDidWebIssuerTests.cs",
          }
          seen = set()
          for part in (1, 2):
              payload = json.loads(Path(f"review-{part}.json").read_text())
              assert payload["head"] == expected_head
              assert payload["part"] == part
              files = set(payload["files"])
              assert files and files.isdisjoint(seen)
              seen.update(files)
              assert payload["review"]["verdict"] in (
                  "no_actionable_findings", "actionable_findings", "inconclusive"
              )
              assert Path(f"review-model-{part}.json").stat().st_size > 20
              assert Path(f"review-{part}.md").stat().st_size > 200
          assert seen == expected_files, (seen, expected_files)
          PY
      - name: Post COMMENTED review (not approval)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent local Qwen2.5-Coder 7B automated full-diff review of PR #231.'
            echo
            echo 'Exact source: e37506c37ff92d16b0a4e6ee7d1a2b89f78da859. Baseline: f810b7591771c109198513dffb6539181a9a453a.'
            echo 'Model findings require actual source/test disposition. This is NOT human approval, external audit or wallet conformance.'
            echo
            cat review-1.md
            echo
            cat review-2.md
            echo
          } > /tmp/pr231-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/231/reviews \
            -f event=COMMENT -f commit_id="e37506c37ff92d16b0a4e6ee7d1a2b89f78da859" \
            -f body="$(cat /tmp/pr231-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
