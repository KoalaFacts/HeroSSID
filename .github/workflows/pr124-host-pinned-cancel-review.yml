name: Independent PR124 host-owned issuer successor HTTP review

on:
  push:
    branches:
      - review/pr124-host-pinned-cancel-20261103

permissions: {}

jobs:
  review:
    name: Independent Qwen five-file host-pinned issuer successor HTTP review
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout helper and immutable Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact product HEAD, main baseline and all five paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 76fe3c61ed3ef164832aeb8e23309c94b4b1aea4^{commit})" = "76fe3c61ed3ef164832aeb8e23309c94b4b1aea4"
          test "$(git rev-parse 19e98c0d9d27492c6647c12279be5d5a33b48639^{commit})" = "19e98c0d9d27492c6647c12279be5d5a33b48639"
          git diff --name-only 19e98c0d9d27492c6647c12279be5d5a33b48639 76fe3c61ed3ef164832aeb8e23309c94b4b1aea4 | sort >/tmp/review-files.txt
          python3 - <<'PY'
          from pathlib import Path
          expected = {
              "src/Services/HeroSSID.Api/Features/Credentials/HostPinnedIssuerSuccessorHttpEndpoints.cs",
              "tests/Integration/HeroSSID.Integration.Tests/HostPinnedIssuerSuccessorHttpIntegrationTests.cs",
              "tests/Unit/HeroSSID.Api.Tests/HostPinnedIssuerSuccessorRegistryTests.cs",
              "docs/issuer-key-successor-http-profile.md",
              "README.md",
          }
          assert set(Path("/tmp/review-files.txt").read_text().splitlines()) == expected
          PY
      - name: Install independent Qwen2.5-Coder model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Independently audit all five changed files using fresh exhaustive shards
        shell: bash
        run: |
          set -euo pipefail
          for part in 1 2 3 4; do
            REVIEW_PART="$part" python3 tools/offline_pr124_review.py
            test -s "review-$part.json"
            test -s "review-model-$part.json"
            test -s "review-$part.md"
            test "$(cat "review-head-$part.txt")" = "76fe3c61ed3ef164832aeb8e23309c94b4b1aea4"
          done
      - name: Preserve raw model inference, exact-head proofs and rendered review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr124-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          retention-days: 30
          if-no-files-found: warn

  publish:
    name: Submit authentic COMMENTED model review against exact PR124 head
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Download independent complete model results
        uses: actions/download-artifact@v4
        with:
          name: independent-pr124-review
      - name: Verify live PR head, full five-file set and original inference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/123 --jq '.head.sha')"
          test "$actual" = "76fe3c61ed3ef164832aeb8e23309c94b4b1aea4"
          gh api repos/KoalaFacts/HeroSSID/pulls/123/files --paginate --jq '.[].filename' | sort >/tmp/pr124-files.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          head = "76fe3c61ed3ef164832aeb8e23309c94b4b1aea4"
          expected = {
              "src/Services/HeroSSID.Api/Features/Credentials/HostPinnedIssuerSuccessorHttpEndpoints.cs",
              "tests/Integration/HeroSSID.Integration.Tests/HostPinnedIssuerSuccessorHttpIntegrationTests.cs",
              "tests/Unit/HeroSSID.Api.Tests/HostPinnedIssuerSuccessorRegistryTests.cs",
              "docs/issuer-key-successor-http-profile.md",
              "README.md",
          }
          assert set(Path("/tmp/pr124-files.txt").read_text().splitlines()) == expected
          all_files = []
          for part in (1, 2, 3, 4):
              data = json.loads(Path(f"review-{part}.json").read_text())
              raw = json.loads(Path(f"review-model-{part}.json").read_text())
              assert data["head"] == head and data["part"] == part
              assert (data["review"]["verdict"] == raw["verdict"] or
                      (raw["verdict"] == "no_actionable_findings" and
                       data["review"]["verdict"] == "inconclusive" and
                       bool(raw["findings"])))
              assert raw["verdict"] in ("no_actionable_findings", "actionable_findings", "inconclusive")
              assert len(Path(f"review-{part}.md").read_text()) > 150
              assert Path(f"review-head-{part}.txt").read_text().strip() == head
              all_files.extend(data["files"])
          assert len(all_files) == len(expected) and set(all_files) == expected
          PY
      - name: Submit truthful independently generated COMMENTED review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "Independent Qwen2.5-Coder 7B local-model review of all five exact PR #124 verifier-pinned issuer successor patches."
            echo
            echo "Reviewed exact HEAD: 76fe3c61ed3ef164832aeb8e23309c94b4b1aea4. Base: 19e98c0d9d27492c6647c12279be5d5a33b48639."
            echo "Automated independent code review only; NOT human approval, an external cryptographic security audit, W3C conformance, third-party Wallet interoperability, personal identity validation or business authorization."
            echo "All authentic raw model verdicts and findings retained; each finding requires evidence-based disposition."
            echo
            cat review-1.md
            echo
            cat review-2.md
            echo
            cat review-3.md
            echo
            cat review-4.md
            echo
            echo
          } >/tmp/pr124-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/123/reviews \
            -f event=COMMENT -f commit_id=76fe3c61ed3ef164832aeb8e23309c94b4b1aea4 \
            -f body="$(cat /tmp/pr124-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
