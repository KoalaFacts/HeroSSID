name: One-off independent offline PR238 review
on:
  push:
    branches:
      - review/pr238-offline-20261108

permissions: {}

jobs:
  review:
    name: Independent Qwen2.5 review of complete pinned PR238 diff
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout review helper and pinned candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable source and baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 6443002e81e3188ec46e36de3bf698b6c0c84ab7^{commit})" = "6443002e81e3188ec46e36de3bf698b6c0c84ab7"
          test "$(git rev-parse cb87b2e505e8f0e7440cd6d2dab004ad7f5454e0^{commit})" = "cb87b2e505e8f0e7440cd6d2dab004ad7f5454e0"
          test "$(git diff --name-only cb87b2e505e8f0e7440cd6d2dab004ad7f5454e0 6443002e81e3188ec46e36de3bf698b6c0c84ab7 | wc -l)" -eq 5
      - name: Install local independent model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Review complete pinned source patches
        shell: bash
        run: |
          set -euo pipefail
          for part in 1 2; do
            REVIEW_PART="$part" python3 tools/offline_pr238_review.py
            test -s "review-$part.md"
            test -s "review-$part.json"
            test "$(cat review-head-$part.txt)" = "6443002e81e3188ec46e36de3bf698b6c0c84ab7"
          done
      - name: Retain raw model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr238-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          if-no-files-found: warn
          retention-days: 30
  publish:
    name: Submit exact-head independent COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download independently completed model artifacts
        uses: actions/download-artifact@v4
        with:
          name: independent-pr238-review
      - name: Verify exact PR238 HEAD and full 5-file model coverage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/KoalaFacts/HeroSSID/pulls/238 --jq '.head.sha')" = "6443002e81e3188ec46e36de3bf698b6c0c84ab7"
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_head = "6443002e81e3188ec46e36de3bf698b6c0c84ab7"
          expected_files = {
              "README.md",
              "docs/cli-vc2-didweb-issuer-status-issue.md",
              "src/Cli/HeroSSID.Cli/Commands/CredentialCommands.cs",
              "src/Cli/HeroSSID.Cli/Commands/CredentialCommands.DidWebStatusIssue.cs",
              "tests/Unit/HeroSSID.Credentials.Tests/CredentialCliVc2DidWebStatusIssuerTests.cs",
          }
          seen = set()
          for part in (1, 2):
              payload = json.loads(Path(f"review-{part}.json").read_text())
              assert payload["head"] == expected_head and payload["part"] == part
              files = set(payload["files"])
              assert files and files.isdisjoint(seen)
              seen.update(files)
              assert payload["review"]["verdict"] in (
                  "no_actionable_findings", "actionable_findings", "inconclusive"
              )
              assert Path(f"review-model-{part}.json").stat().st_size > 20
              assert Path(f"review-{part}.md").stat().st_size > 200
          assert seen == expected_files
          PY
      - name: Publish real COMMENTED review without approval claim
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent local Qwen2.5-Coder 7B automated code review of PR #238.'
            echo
            echo 'Exact source: 6443002e81e3188ec46e36de3bf698b6c0c84ab7. Baseline: cb87b2e505e8f0e7440cd6d2dab004ad7f5454e0.'
            echo 'Not human approval, third-party Wallet interoperability or an external security audit.'
            echo 'Each finding must be checked against actual source and tests before merge.'
            echo
            cat review-1.md
            echo
            cat review-2.md
          } > /tmp/pr238-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/238/reviews \
            -f event=COMMENT -f commit_id="6443002e81e3188ec46e36de3bf698b6c0c84ab7" \
            -f body="$(cat /tmp/pr238-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
