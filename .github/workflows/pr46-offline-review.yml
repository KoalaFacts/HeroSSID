name: One-off independent offline PR46 review
on:
  push:
    branches:
      - review/pr46-offline-20261030

permissions: {}

jobs:
  review:
    name: Independent model review of complete PR46 patch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout immutable helper and pinned candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pinned source and baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse c24116cd6997a5b75a83d6df11b4b9b08e74b2c8^{commit})" = "c24116cd6997a5b75a83d6df11b4b9b08e74b2c8"
          test "$(git rev-parse 794bd6591f3627ed769e5fe0e97d7dd953873ab9^{commit})" = "794bd6591f3627ed769e5fe0e97d7dd953873ab9"
          test "$(git diff --name-only 794bd6591f3627ed769e5fe0e97d7dd953873ab9 c24116cd6997a5b75a83d6df11b4b9b08e74b2c8 | wc -l)" -eq 5
      - name: Install isolated local review model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Review complete pinned file patches
        shell: bash
        run: |
          set -euo pipefail
          for part in 1 2; do
            REVIEW_PART="$part" python3 tools/offline_pr46_review.py
            test -s "review-$part.md"
            test -s "review-$part.json"
            test "$(cat review-head-$part.txt)" = "c24116cd6997a5b75a83d6df11b4b9b08e74b2c8"
          done
      - name: Retain raw review and model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr46-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Submit verified independent model COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download complete model review
        uses: actions/download-artifact@v4
        with:
          name: independent-pr46-review
      - name: Verify changed files, model evidence and unchanged PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/46 --jq '.head.sha')"
          test "$actual" = "c24116cd6997a5b75a83d6df11b4b9b08e74b2c8"
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_head = "c24116cd6997a5b75a83d6df11b4b9b08e74b2c8"
          expected_files = {
              "README.md",
              "docs/ingress-rate-limits.md",
              "src/Services/HeroSSID.Api/Ingress/IngressProtection.cs",
              "src/Services/HeroSSID.Api/Program.cs",
              "tests/Unit/HeroSSID.Api.Tests/IngressProtectionTests.cs",
          }
          seen = set()
          for part in (1, 2):
              payload = json.loads(Path(f"review-{part}.json").read_text())
              assert payload["head"] == expected_head
              assert payload["part"] == part
              files = set(payload["files"])
              assert files and files.isdisjoint(seen)
              seen.update(files)
              assert payload["review"]["verdict"] in (
                  "no_actionable_findings", "actionable_findings", "inconclusive"
              )
              assert Path(f"review-model-{part}.json").stat().st_size > 20
              assert Path(f"review-{part}.md").stat().st_size > 200
          assert seen == expected_files
          PY
      - name: Publish COMMENTED review (not APPROVED)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent local Qwen2.5-Coder 7B automated code review of PR #46.'
            echo
            echo 'Exact source: c24116cd6997a5b75a83d6df11b4b9b08e74b2c8. Baseline: 794bd6591f3627ed769e5fe0e97d7dd953873ab9.'
            echo 'This is NOT human approval, an external audit or independent wallet conformance.'
            echo 'Investigate every finding against the actual source and tests before merge.'
            echo
            cat review-1.md
            echo
            cat review-2.md
            echo
          } > /tmp/pr46-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/46/reviews \
            -f event=COMMENT -f commit_id="c24116cd6997a5b75a83d6df11b4b9b08e74b2c8" \
            -f body="$(cat /tmp/pr46-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
