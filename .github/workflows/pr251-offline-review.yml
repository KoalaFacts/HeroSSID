name: One-off independent offline PR251 agent scope VP/status review
on:
  push:
    branches:
      - review/pr251-agent-vp-status-20261109

permissions: {}

jobs:
  review:
    name: Independent Qwen2.5 review of VC2 agent status-bound holder proof CLI
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout review helper and pinned candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable source and baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 7b71f1c711704c8a3cc91adbd8b1800aee4589b8^{commit})" = "7b71f1c711704c8a3cc91adbd8b1800aee4589b8"
          test "$(git rev-parse 0db514ea61f3b68d934b0fc29a959cc0ceba2e94^{commit})" = "0db514ea61f3b68d934b0fc29a959cc0ceba2e94"
          test "$(git diff --name-only 0db514ea61f3b68d934b0fc29a959cc0ceba2e94 7b71f1c711704c8a3cc91adbd8b1800aee4589b8 | wc -l)" -eq 6
      - name: Install local independent model
        shell: bash
        run: |
          set -euo pipefail
          if ! curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 5 https://ollama.com/install.sh --output /tmp/ollama-install.sh; then
            curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/ollama/ollama/main/scripts/install.sh --output /tmp/ollama-install.sh
          fi
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          for attempt in 1 2 3; do
            if ollama pull qwen2.5-coder:7b; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 12
          done
      - name: Review complete pinned source patches
        shell: bash
        run: |
          set -euo pipefail
          for part in 1 2; do
            REVIEW_PART="$part" python3 tools/offline_pr251_review.py
            test -s "review-$part.md"
            test -s "review-$part.json"
            test "$(cat review-head-$part.txt)" = "7b71f1c711704c8a3cc91adbd8b1800aee4589b8"
          done
      - name: Retain raw model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr251-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          if-no-files-found: warn
          retention-days: 30
  publish:
    name: Submit exact-head independent COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download independently completed model artifacts
        uses: actions/download-artifact@v4
        with:
          name: independent-pr251-review
      - name: Verify exact PR251 HEAD and full 6-file model coverage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/KoalaFacts/HeroSSID/pulls/251 --jq '.head.sha')" = "7b71f1c711704c8a3cc91adbd8b1800aee4589b8"
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_head = "7b71f1c711704c8a3cc91adbd8b1800aee4589b8"
          expected_files = {
              "README.md",
              "docs/cli-vc2-agent-scope-vp-status.md",
              "src/Cli/HeroSSID.Cli/Commands/CredentialCommands.Vc11VerifierSession.cs",
              "src/Cli/HeroSSID.Cli/Commands/CredentialCommands.Vc2AgentScopeVerifierStatus.cs",
              "src/Cli/HeroSSID.Cli/Commands/CredentialCommands.cs",
              "tests/Unit/HeroSSID.Credentials.Tests/CredentialCliVc2AgentScopeVerifierStatusTests.cs",
          }
          seen = set()
          for part in (1, 2):
              payload = json.loads(Path(f"review-{part}.json").read_text())
              assert payload["head"] == expected_head and payload["part"] == part
              files = set(payload["files"])
              assert files and files.isdisjoint(seen)
              seen.update(files)
              assert payload["review"]["verdict"] in (
                  "no_actionable_findings", "actionable_findings", "inconclusive"
              )
              assert Path(f"review-model-{part}.json").stat().st_size > 20
              assert Path(f"review-{part}.md").stat().st_size > 200
          assert seen == expected_files
          PY
      - name: Publish real COMMENTED review without approval claim
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent local Qwen2.5-Coder 7B automated code review of PR #251.'
            echo
            echo 'Exact source: 7b71f1c711704c8a3cc91adbd8b1800aee4589b8. Baseline: 0db514ea61f3b68d934b0fc29a959cc0ceba2e94.'
            echo 'Not human approval, third-party Wallet interoperability or an external security audit.'
            echo 'Each finding must be checked against actual source and tests before merge.'
            echo
            cat review-1.md
            echo
            cat review-2.md
          } > /tmp/pr251-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/251/reviews \
            -f event=COMMENT -f commit_id="7b71f1c711704c8a3cc91adbd8b1800aee4589b8" \
            -f body="$(cat /tmp/pr251-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
