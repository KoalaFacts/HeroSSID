name: One-off independent offline PR56 review
on:
  push:
    branches:
      - review/pr56-jwtvc-status-20261031

permissions: {}

jobs:
  review:
    name: Independent model review of complete PR56 patch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout immutable helper and pinned candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pinned source and baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 55732e46b954ffe3d9a08950f70c38ba51f59e22^{commit})" = "55732e46b954ffe3d9a08950f70c38ba51f59e22"
          test "$(git rev-parse 5e89349d1ba522e74d3cf22bf291c683dbe0685f^{commit})" = "5e89349d1ba522e74d3cf22bf291c683dbe0685f"
          test "$(git diff --name-only 5e89349d1ba522e74d3cf22bf291c683dbe0685f 55732e46b954ffe3d9a08950f70c38ba51f59e22 | wc -l)" -eq 6
      - name: Install isolated local review model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Review complete pinned file patches
        shell: bash
        run: |
          set -euo pipefail
          for part in 1; do
            REVIEW_PART="$part" python3 tools/offline_pr56_review.py
            test -s "review-$part.md"
            test -s "review-$part.json"
            test "$(cat review-head-$part.txt)" = "55732e46b954ffe3d9a08950f70c38ba51f59e22"
          done
      - name: Retain raw review and model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr56-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Submit verified independent model COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download complete model review
        uses: actions/download-artifact@v4
        with:
          name: independent-pr56-review
      - name: Verify changed files, model evidence and unchanged PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/56 --jq '.head.sha')"
          test "$actual" = "55732e46b954ffe3d9a08950f70c38ba51f59e22"
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_head = "55732e46b954ffe3d9a08950f70c38ba51f59e22"
          expected_files = {"README.md", "docs/jwt-vc-json-openid4vp-direct-post-profile.md", "docs/jwt-vc-json-revocation-direct-post-profile.md", "src/Libraries/HeroSSID.Credentials/JwtVcJson/JwtVcJsonDirectPostRevocation.cs", "src/Libraries/HeroSSID.Credentials/JwtVcJson/JwtVcJsonRevocationSnapshot.cs", "tests/Unit/HeroSSID.Credentials.Tests/JwtVcJsonDirectPostRevocationTests.cs"}
          seen = set()
          for part in (1,):
              payload = json.loads(Path(f"review-{part}.json").read_text())
              assert payload["head"] == expected_head
              assert payload["part"] == part
              files = set(payload["files"])
              assert files and files.isdisjoint(seen)
              seen.update(files)
              assert payload["review"]["verdict"] in (
                  "no_actionable_findings", "actionable_findings", "inconclusive"
              )
              assert Path(f"review-model-{part}.json").stat().st_size > 20
              assert Path(f"review-{part}.md").stat().st_size > 200
          assert seen == expected_files
          PY
      - name: Publish COMMENTED review (not APPROVED)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent local Qwen2.5-Coder 7B CI security code review of PR #56.'
            echo
            echo 'Exact source: 55732e46b954ffe3d9a08950f70c38ba51f59e22. Baseline: 5e89349d1ba522e74d3cf22bf291c683dbe0685f.'
            echo 'This automated review is NOT human approval or an external security audit.'
            echo 'Investigate every finding against the actual source and tests before merge.'
            echo
            cat review-1.md
            echo
            echo
          } > /tmp/pr56-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/56/reviews \
            -f event=COMMENT -f commit_id="55732e46b954ffe3d9a08950f70c38ba51f59e22" \
            -f body="$(cat /tmp/pr56-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
