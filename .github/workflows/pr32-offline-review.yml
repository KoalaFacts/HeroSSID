name: One-off independent offline PR32 review
on:
  push:
    branches:
      - review/pr32-offline-20261029

permissions: {}

jobs:
  review:
    name: Independent model review of complete PR32 patch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout immutable helper and pinned candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pinned source and baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 66201c0f561233d367a094b904d31da4b3399f28^{commit})" = "66201c0f561233d367a094b904d31da4b3399f28"
          test "$(git rev-parse 48b1e03758164b39f548a5a21b2d9156fcf7aae1^{commit})" = "48b1e03758164b39f548a5a21b2d9156fcf7aae1"
          test "$(git diff --name-only 48b1e03758164b39f548a5a21b2d9156fcf7aae1 66201c0f561233d367a094b904d31da4b3399f28 | wc -l)" -eq 9
      - name: Install isolated local review model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Review complete pinned file patches
        shell: bash
        env:
          REVIEW_PART: '1'
        run: |
          set -euo pipefail
          python3 tools/offline_pr32_review.py
          test -s review-1.md
          test -s review-1.json
          test "$(cat review-head-1.txt)" = "66201c0f561233d367a094b904d31da4b3399f28"
      - name: Retain raw review and model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr32-review
          path: |
            review-1.md
            review-1.json
            review-head-1.txt
            review-model-1.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Submit verified independent model COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download complete model review
        uses: actions/download-artifact@v4
        with:
          name: independent-pr32-review
      - name: Verify changed files, model evidence and unchanged PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/32 --jq '.head.sha')"
          test "$actual" = "66201c0f561233d367a094b904d31da4b3399f28"
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_head = "66201c0f561233d367a094b904d31da4b3399f28"
          expected_files = {
              "tests/Contract/HeroSSID.OpenID4VC.Contract.Tests/CanonicalDidDocumentHttpTests.cs",
              "tests/Unit/HeroSSID.DidOperations.Tests/CanonicalDidResolutionTests.cs",
              "src/Libraries/HeroSSID.DidOperations/DidResolution/DidResolutionService.cs",
              "src/Libraries/HeroSSID.DidOperations/DidResolution/ICanonicalDidResolutionService.cs",
              "src/Services/HeroSSID.Api/Program.cs",
              "tests/Unit/HeroSSID.DidOperations.Tests/LegacyDidResolutionInterfaceTests.cs",
              "src/Services/HeroSSID.Api/Features/Dids/DidEndpoints.cs",
              "docs/did-key-profile.md",
              "README.md",
          }
          payload = json.loads(Path("review-1.json").read_text())
          assert payload["head"] == expected_head
          assert set(payload["files"]) == expected_files
          assert payload["review"]["verdict"] in (
              "no_actionable_findings", "actionable_findings", "inconclusive"
          )
          assert Path("review-model-1.json").stat().st_size > 20
          assert Path("review-1.md").stat().st_size > 200
          PY
      - name: Publish COMMENTED review (not APPROVED)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent local Qwen2.5-Coder 7B automated code review of PR #32.'
            echo
            echo 'Exact source: 66201c0f561233d367a094b904d31da4b3399f28. Baseline: 48b1e03758164b39f548a5a21b2d9156fcf7aae1.'
            echo 'This is NOT human approval, an external audit or independent wallet conformance.'
            echo 'Investigate every finding against the actual source and tests before merge.'
            echo
            cat review-1.md
          } > /tmp/pr32-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/32/reviews \
            -f event=COMMENT -f commit_id="66201c0f561233d367a094b904d31da4b3399f28" \
            -f body="$(cat /tmp/pr32-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
