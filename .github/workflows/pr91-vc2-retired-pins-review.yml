name: Independent PR91 authenticated VC2 retired issuer exact-JWT review

on:
  push:
    branches:
      - review/pr91-vc2-retired-pins-20261101

permissions: {}

jobs:
  review:
    name: Independent Qwen two-part exact-head VC2 retired issuer exact-JWT security review
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout independent review helper and immutable candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate pinned candidate and all four changed files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 9ce40e9da992e7ee68b17c58ce0297d76876400f^{commit})" = "9ce40e9da992e7ee68b17c58ce0297d76876400f"
          test "$(git rev-parse 41582dfa66f4642d05a094d4c9a77086c0a30c85^{commit})" = "41582dfa66f4642d05a094d4c9a77086c0a30c85"
          test "$(git diff --name-only 41582dfa66f4642d05a094d4c9a77086c0a30c85 9ce40e9da992e7ee68b17c58ce0297d76876400f | wc -l)" -eq 4
      - name: Install independent local model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Independent model review part 1
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_PART=1 python3 tools/offline_pr91_review.py
          test -s review-1.md
          test -s review-1.json
          test -s review-model-1.json
          test "$(cat review-head-1.txt)" = "9ce40e9da992e7ee68b17c58ce0297d76876400f"
      - name: Independent model review part 2
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_PART=2 python3 tools/offline_pr91_review.py
          test -s review-2.md
          test -s review-2.json
          test -s review-model-2.json
          test "$(cat review-head-2.txt)" = "9ce40e9da992e7ee68b17c58ce0297d76876400f"
      - name: Preserve full original model results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr91-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          retention-days: 30
          if-no-files-found: warn

  publish:
    name: Submit actual exact-head independent COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download original model output without rerunning model
        uses: actions/download-artifact@v4
        with:
          name: independent-pr91-review
      - name: Verify PR91 head and all four changed source/doc/test files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/91 --jq '.head.sha')"
          test "$actual" = "9ce40e9da992e7ee68b17c58ce0297d76876400f"
          gh api repos/KoalaFacts/HeroSSID/pulls/91/files --paginate --jq '.[].filename' | sort >/tmp/pr91-actual-files.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_head = "9ce40e9da992e7ee68b17c58ce0297d76876400f"
          expected = {
              "README.md",
              "docs/vcdm20-retired-issuer-exact-pins.md",
              "src/Libraries/HeroSSID.Credentials/Vcdm20/Vcdm20RetiredIssuerVerifier.cs",
              "tests/Unit/HeroSSID.Credentials.Tests/Vcdm20RetiredIssuerVerifierTests.cs",
          }
          assert set(Path("/tmp/pr91-actual-files.txt").read_text().splitlines()) == expected
          seen = []
          for part in (1, 2):
              data = json.loads(Path(f"review-{part}.json").read_text())
              raw = json.loads(Path(f"review-model-{part}.json").read_text())
              assert data["head"] == expected_head and data["part"] == part
              assert data["review"]["verdict"] == raw["verdict"]
              assert raw["verdict"] in ("no_actionable_findings", "actionable_findings", "inconclusive")
              assert len(Path(f"review-{part}.md").read_text()) > 200
              assert Path(f"review-head-{part}.txt").read_text().strip() == expected_head
              seen.extend(data["files"])
          assert len(seen) == len(expected) and set(seen) == expected
          PY
      - name: Publish raw truthful verdict and findings to PR91
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "Independent Qwen2.5-Coder 7B review of ALL FOUR changed PR #91 authenticated direct VC2 retired issuer exact-JWT files."
            echo
            echo "Reviewed exact HEAD: 9ce40e9da992e7ee68b17c58ce0297d76876400f."
            echo "Base: 41582dfa66f4642d05a094d4c9a77086c0a30c85."
            echo "Automated local model review, NOT human approval, wallet conformance or external cryptographic audit."
            echo "All findings require itemized source/test disposition before merge."
            echo
            cat review-1.md
            echo
            cat review-2.md
          } >/tmp/pr91-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/91/reviews \
            -f event=COMMENT -f commit_id=9ce40e9da992e7ee68b17c58ce0297d76876400f \
            -f body="$(cat /tmp/pr91-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
