name: Independent exact-head PR66 OpenID4VP by-value wallet review

on:
  push:
    branches:
      - review/pr66-openid4vp-by-value-20261031

permissions: {}

jobs:
  review:
    name: Independent model security review of complete six-file by-value wallet invocation patch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout pinned candidate and helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable source and complete six-file diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse c88c6741a59ab12506e5fa651125b86f9ccc0589^{commit})" = "c88c6741a59ab12506e5fa651125b86f9ccc0589"
          test "$(git rev-parse dc02d877e4ebd119feb8340faf6508e0f5ba1aa2^{commit})" = "dc02d877e4ebd119feb8340faf6508e0f5ba1aa2"
          test "$(git diff --name-only dc02d877e4ebd119feb8340faf6508e0f5ba1aa2 c88c6741a59ab12506e5fa651125b86f9ccc0589 | wc -l)" -eq 6
      - name: Install independent local model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Independently inspect all six source test and documentation patches
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_PART=1 python3 tools/offline_pr66_review.py
          test -s review-1.md
          test -s review-1.json
          test -s review-model-1.json
          test "$(cat review-head-1.txt)" = "c88c6741a59ab12506e5fa651125b86f9ccc0589"
      - name: Retain raw model artifact and exact-head provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr66-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Submit exact-head independent COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download raw review and structured findings
        uses: actions/download-artifact@v4
        with:
          name: independent-pr66-review
      - name: Verify PR head and exact six-file model coverage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/66 --jq '.head.sha')"
          test "$actual" = "c88c6741a59ab12506e5fa651125b86f9ccc0589"
          python3 - <<'PY'
          import json
          from pathlib import Path
          head = "c88c6741a59ab12506e5fa651125b86f9ccc0589"
          expected = {
            "README.md",
            "docs/jwt-vc-json-openid4vp-http-profile.md",
            "src/Libraries/HeroSSID.Credentials/VerifiablePresentations/OpenId4VpJwtVcJsonDirectPost.cs",
            "src/Services/HeroSSID.Api/Features/Credentials/JwtVcJsonOpenId4VpHttpEndpoints.cs",
            "tests/Integration/HeroSSID.Integration.Tests/JwtVcJsonOpenId4VpHttpIntegrationTests.cs",
            "tests/Unit/HeroSSID.Credentials.Tests/OpenId4VpJwtVcJsonDirectPostTests.cs",
          }
          result = json.loads(Path("review-1.json").read_text())
          raw = json.loads(Path("review-model-1.json").read_text())
          assert result["head"] == head and result["part"] == 1
          assert set(result["files"]) == expected and len(result["files"]) == len(expected)
          assert result["review"]["verdict"] == raw["verdict"]
          assert raw["verdict"] in ("no_actionable_findings", "actionable_findings", "inconclusive")
          assert len(Path("review-1.md").read_text()) > 200
          assert Path("review-head-1.txt").read_text().strip() == head
          PY
      - name: Submit independent model findings without claiming human approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent Qwen2.5-Coder 7B security/code review of all six changed PR #66 OpenID4VP signed by-value wallet invocation files.'
            echo
            echo 'Reviewed exact head: c88c6741a59ab12506e5fa651125b86f9ccc0589.'
            echo 'Baseline: dc02d877e4ebd119feb8340faf6508e0f5ba1aa2.'
            echo 'This is a submitted independent MODEL review, not human approval or external cryptographic certification.'
            echo 'All findings require explicit source/test verification before merge.'
            echo
            cat review-1.md
          } > /tmp/pr66-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/66/reviews \
            -f event=COMMENT -f commit_id=c88c6741a59ab12506e5fa651125b86f9ccc0589 \
            -f body="$(cat /tmp/pr66-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
