name: One-off independent offline PR224 review
on:
  push:
    branches:
      - review/pr224-offline-20261107

permissions: {}

jobs:
  review:
    name: Independent Qwen model review of exact PR224 code
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout independent helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact PR head, baseline and three-file scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin fix/verifier-full-issuer-preflight-20261107:refs/remotes/origin/pr224-reviewed-source
          test "$(gh api repos/KoalaFacts/HeroSSID/pulls/222 --jq '.head.sha')" = "37e65a97add0dd77531f8ca0be082d2723c2ebab"
          test "$(git rev-parse 37e65a97add0dd77531f8ca0be082d2723c2ebab^{commit})" = "37e65a97add0dd77531f8ca0be082d2723c2ebab"
          test "$(git rev-parse f921af6ab841621efc1c5fd4f349ee9ba228a23d^{commit})" = "f921af6ab841621efc1c5fd4f349ee9ba228a23d"
          test "$(git diff --name-only f921af6ab841621efc1c5fd4f349ee9ba228a23d 37e65a97add0dd77531f8ca0be082d2723c2ebab | wc -l)" -eq 3
      - name: Install isolated independent local model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Independently evaluate all three exact-head file patches in two shards
        shell: bash
        run: |
          set -euo pipefail
          for part in 1 2; do
            REVIEW_PART="$part" python3 tools/offline_pr224_review.py
            test -s "review-$part.md"
            test -s "review-$part.json"
            test "$(cat review-head-$part.txt)" = "37e65a97add0dd77531f8ca0be082d2723c2ebab"
          done
      - name: Preserve complete raw findings and model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr224-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Submit verified independent model COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download both complete model review shards
        uses: actions/download-artifact@v4
        with:
          name: independent-pr224-review
      - name: Verify complete coverage and exact unchanged PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/222 --jq '.head.sha')"
          test "$actual" = "37e65a97add0dd77531f8ca0be082d2723c2ebab"
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_head = "37e65a97add0dd77531f8ca0be082d2723c2ebab"
          expected_files = {
              "docs/did-web-verifier-online-status-admission.md",
              "src/Libraries/HeroSSID.Credentials/JwtVcJson/JwtVcJsonPinnedDidWebOnlineAdmission.cs",
              "tests/Unit/HeroSSID.Credentials.Tests/JwtVcJsonPinnedDidWebOnlineAdmissionTests.cs",
          }
          seen = set()
          for part in (1, 2):
              payload = json.loads(Path(f"review-{part}.json").read_text())
              assert payload["head"] == expected_head
              assert payload["part"] == part
              files = set(payload["files"])
              assert files and files.isdisjoint(seen)
              seen.update(files)
              assert payload["review"]["verdict"] in (
                  "no_actionable_findings", "actionable_findings", "inconclusive"
              )
              assert Path(f"review-model-{part}.json").stat().st_size > 20
              assert Path(f"review-{part}.md").stat().st_size > 200
          assert seen == expected_files, (seen, expected_files)
          PY
      - name: Post COMMENTED review (not approval)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent local Qwen2.5-Coder 7B automated full-diff review of PR #224.'
            echo
            echo 'Exact source: 37e65a97add0dd77531f8ca0be082d2723c2ebab. Baseline: f921af6ab841621efc1c5fd4f349ee9ba228a23d.'
            echo 'Model findings require actual source/test disposition. This is NOT human approval, external audit or wallet conformance.'
            echo
            cat review-1.md
            echo
            cat review-2.md
            echo
          } > /tmp/pr224-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/222/reviews \
            -f event=COMMENT -f commit_id="37e65a97add0dd77531f8ca0be082d2723c2ebab" \
            -f body="$(cat /tmp/pr224-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
