name: One-off independent offline PR254 VC2 direct did:key issuer CLI review
on:
  push:
    branches:
      - review/pr254-vc2-didkey-issuer-20261109

permissions: {}

jobs:
  review:
    name: Independent Qwen2.5 review of direct VC2 did:key credential issuer CLI
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout review helper and pinned candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable source and baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse ddfa411c0a0c3d05c56fc9a871332630f2d2d335^{commit})" = "ddfa411c0a0c3d05c56fc9a871332630f2d2d335"
          test "$(git rev-parse 463f92f68ad6b6ef2e33a6454ebd6d3aa1787d22^{commit})" = "463f92f68ad6b6ef2e33a6454ebd6d3aa1787d22"
          test "$(git diff --name-only 463f92f68ad6b6ef2e33a6454ebd6d3aa1787d22 ddfa411c0a0c3d05c56fc9a871332630f2d2d335 | wc -l)" -eq 5
      - name: Install local independent model
        shell: bash
        run: |
          set -euo pipefail
          if ! curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 5 https://ollama.com/install.sh --output /tmp/ollama-install.sh; then
            curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/ollama/ollama/main/scripts/install.sh --output /tmp/ollama-install.sh
          fi
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          for attempt in 1 2 3; do
            if ollama pull qwen2.5-coder:7b; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 12
          done
      - name: Review complete pinned source patches
        shell: bash
        run: |
          set -euo pipefail
          for part in 1 2; do
            REVIEW_PART="$part" python3 tools/offline_pr254_review.py
            test -s "review-$part.md"
            test -s "review-$part.json"
            test "$(cat review-head-$part.txt)" = "ddfa411c0a0c3d05c56fc9a871332630f2d2d335"
          done
      - name: Retain raw model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr254-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          if-no-files-found: warn
          retention-days: 30
  publish:
    name: Submit exact-head independent COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download independently completed model artifacts
        uses: actions/download-artifact@v4
        with:
          name: independent-pr254-review
      - name: Verify exact PR254 HEAD and full 5-file model coverage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/KoalaFacts/HeroSSID/pulls/254 --jq '.head.sha')" = "ddfa411c0a0c3d05c56fc9a871332630f2d2d335"
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_head = "ddfa411c0a0c3d05c56fc9a871332630f2d2d335"
          expected_files = {
              "README.md",
              "docs/cli-vc2-didkey-issuer-issue.md",
              "src/Cli/HeroSSID.Cli/Commands/CredentialCommands.DidKeyIssue.cs",
              "src/Cli/HeroSSID.Cli/Commands/CredentialCommands.cs",
              "tests/Unit/HeroSSID.Credentials.Tests/Vcdm20DidKeyIssuerCliIssuanceTests.cs",
          }
          seen = set()
          for part in (1, 2):
              payload = json.loads(Path(f"review-{part}.json").read_text())
              assert payload["head"] == expected_head and payload["part"] == part
              files = set(payload["files"])
              assert files and files.isdisjoint(seen)
              seen.update(files)
              assert payload["review"]["verdict"] in (
                  "no_actionable_findings", "actionable_findings", "inconclusive"
              )
              assert Path(f"review-model-{part}.json").stat().st_size > 20
              assert Path(f"review-{part}.md").stat().st_size > 200
          assert seen == expected_files
          PY
      - name: Publish real COMMENTED review without approval claim
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent local Qwen2.5-Coder 7B automated code review of PR #254.'
            echo
            echo 'Exact source: ddfa411c0a0c3d05c56fc9a871332630f2d2d335. Baseline: 463f92f68ad6b6ef2e33a6454ebd6d3aa1787d22.'
            echo 'Not human approval, third-party Wallet interoperability or an external security audit.'
            echo 'Each finding must be checked against actual source and tests before merge.'
            echo
            cat review-1.md
            echo
            cat review-2.md
          } > /tmp/pr254-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/254/reviews \
            -f event=COMMENT -f commit_id="ddfa411c0a0c3d05c56fc9a871332630f2d2d335" \
            -f body="$(cat /tmp/pr254-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
