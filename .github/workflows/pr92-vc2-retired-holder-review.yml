name: Independent PR92 VC2 retired issuer holder proof review

on:
  push:
    branches:
      - review/pr92-vc2-retired-holder-20261101

permissions: {}

jobs:
  review:
    name: Independent Qwen two-part exact-head VC2 retired issuer holder proof review
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout independent review helper and immutable candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate pinned candidate and all five changed files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 7e385ede3337adbb9d76189830fd560c89e89c9e^{commit})" = "7e385ede3337adbb9d76189830fd560c89e89c9e"
          test "$(git rev-parse c219b8b42abec8600daf6631272e921c0d09dab9^{commit})" = "c219b8b42abec8600daf6631272e921c0d09dab9"
          test "$(git diff --name-only c219b8b42abec8600daf6631272e921c0d09dab9 7e385ede3337adbb9d76189830fd560c89e89c9e | wc -l)" -eq 5
      - name: Install independent local model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Independent model review part 1
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_PART=1 python3 tools/offline_pr92_review.py
          test -s review-1.md
          test -s review-1.json
          test -s review-model-1.json
          test "$(cat review-head-1.txt)" = "7e385ede3337adbb9d76189830fd560c89e89c9e"
      - name: Independent model review part 2
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_PART=2 python3 tools/offline_pr92_review.py
          test -s review-2.md
          test -s review-2.json
          test -s review-model-2.json
          test "$(cat review-head-2.txt)" = "7e385ede3337adbb9d76189830fd560c89e89c9e"
      - name: Preserve full original model results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr92-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          retention-days: 30
          if-no-files-found: warn

  publish:
    name: Submit actual exact-head independent COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download original model output without rerunning model
        uses: actions/download-artifact@v4
        with:
          name: independent-pr92-review
      - name: Verify PR92 head and all five changed source/doc/test files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/92 --jq '.head.sha')"
          test "$actual" = "7e385ede3337adbb9d76189830fd560c89e89c9e"
          gh api repos/KoalaFacts/HeroSSID/pulls/92/files --paginate --jq '.[].filename' | sort >/tmp/pr92-actual-files.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_head = "7e385ede3337adbb9d76189830fd560c89e89c9e"
          expected = {
              "README.md",
              "docs/vcdm20-retired-issuer-holder-proof.md",
              "src/Libraries/HeroSSID.Credentials/Vcdm20/Vcdm20JosePresentation.cs",
              "src/Libraries/HeroSSID.Credentials/Vcdm20/Vcdm20RetiredIssuerPresentation.cs",
              "tests/Unit/HeroSSID.Credentials.Tests/Vcdm20RetiredIssuerPresentationTests.cs",
          }
          assert set(Path("/tmp/pr92-actual-files.txt").read_text().splitlines()) == expected
          seen = []
          for part in (1, 2):
              data = json.loads(Path(f"review-{part}.json").read_text())
              raw = json.loads(Path(f"review-model-{part}.json").read_text())
              assert data["head"] == expected_head and data["part"] == part
              assert data["review"]["verdict"] == raw["verdict"]
              assert raw["verdict"] in ("no_actionable_findings", "actionable_findings", "inconclusive")
              assert len(Path(f"review-{part}.md").read_text()) > 200
              assert Path(f"review-head-{part}.txt").read_text().strip() == expected_head
              seen.extend(data["files"])
          assert len(seen) == len(expected) and set(seen) == expected
          PY
      - name: Publish raw truthful verdict and findings to PR92
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "Independent Qwen2.5-Coder 7B review of ALL FIVE changed PR #92 VC2 retired issuer holder proof files."
            echo
            echo "Reviewed exact HEAD: 7e385ede3337adbb9d76189830fd560c89e89c9e."
            echo "Base: c219b8b42abec8600daf6631272e921c0d09dab9."
            echo "Automated local model review, NOT human approval, wallet conformance or external cryptographic audit."
            echo "All findings require itemized source/test disposition before merge."
            echo
            cat review-1.md
            echo
            cat review-2.md
          } >/tmp/pr92-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/92/reviews \
            -f event=COMMENT -f commit_id=7e385ede3337adbb9d76189830fd560c89e89c9e \
            -f body="$(cat /tmp/pr92-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
