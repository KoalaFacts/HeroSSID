name: Independent exact-head PR77 strict VC2 direct-JOSE review

on:
  push:
    branches:
      - review/pr77-vc2-strict-payload-20261031

permissions: {}

jobs:
  review:
    name: Independent model review of all three strict VC2 profile patches
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout pinned candidate and helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable candidate and complete three-file diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 71ab8fc40a8ccd59fdad3a94406d50299732867c^{commit})" = "71ab8fc40a8ccd59fdad3a94406d50299732867c"
          test "$(git rev-parse 40cd7b8712e801bded13bdc456623821ef7a0c98^{commit})" = "40cd7b8712e801bded13bdc456623821ef7a0c98"
          test "$(git diff --name-only 40cd7b8712e801bded13bdc456623821ef7a0c98 71ab8fc40a8ccd59fdad3a94406d50299732867c | wc -l)" -eq 3
      - name: Install local independent review model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Independently examine complete issuer and verifier context shadowing patch
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_PART=1 python3 tools/offline_pr77_review.py
          test -s review-1.md
          test -s review-1.json
          test -s review-model-1.json
          test "$(cat review-head-1.txt)" = "71ab8fc40a8ccd59fdad3a94406d50299732867c"
      - name: Retain independent raw review and exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr77-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Submit independent exact-head COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download independent model artifacts
        uses: actions/download-artifact@v4
        with:
          name: independent-pr77-review
      - name: Confirm source HEAD and all three files received model review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/77 --jq '.head.sha')"
          test "$actual" = "71ab8fc40a8ccd59fdad3a94406d50299732867c"
          python3 - <<'PY'
          import json
          from pathlib import Path
          head = "71ab8fc40a8ccd59fdad3a94406d50299732867c"
          expected = {
            "docs/vcdm20-jose-profile.md",
            "src/Libraries/HeroSSID.Credentials/Vcdm20/Vcdm20JoseCredential.cs",
            "tests/Unit/HeroSSID.Credentials.Tests/Vcdm20JoseCredentialTests.cs",
          }
          result = json.loads(Path("review-1.json").read_text())
          raw = json.loads(Path("review-model-1.json").read_text())
          assert result["head"] == head and result["part"] == 1
          assert result["review"]["verdict"] == raw["verdict"]
          assert raw["verdict"] in ("no_actionable_findings", "actionable_findings", "inconclusive")
          assert set(result["files"]) == expected and len(result["files"]) == len(expected)
          assert len(Path("review-1.md").read_text()) > 200
          assert Path("review-head-1.txt").read_text().strip() == head
          PY
      - name: Publish actual independent findings, not human approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent Qwen2.5-Coder 7B security/code review of ALL three changed PR #77 VC2 strict-JOSE profile files.'
            echo
            echo 'Reviewed exact head: 71ab8fc40a8ccd59fdad3a94406d50299732867c.'
            echo 'Baseline: 40cd7b8712e801bded13bdc456623821ef7a0c98.'
            echo 'A submitted independent MODEL review, not human approval or cryptographic certification.'
            echo 'Every finding must be reconciled with actual source/tests before merge.'
            echo
            cat review-1.md
          } > /tmp/pr77-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/77/reviews \
            -f event=COMMENT -f commit_id=71ab8fc40a8ccd59fdad3a94406d50299732867c \
            -f body="$(cat /tmp/pr77-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
