name: One-off independent offline PR34 review
on:
  push:
    branches:
      - review/pr34-offline-20261029

permissions: {}

jobs:
  review:
    name: Independent model review of complete PR34 patch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout immutable helper and pinned candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pinned source and baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 099f567f2ded830cd102f6e594a9a497b23cbfc2^{commit})" = "099f567f2ded830cd102f6e594a9a497b23cbfc2"
          test "$(git rev-parse 85730b47cabbb34110b46e2b748440bbd96fb260^{commit})" = "85730b47cabbb34110b46e2b748440bbd96fb260"
          test "$(git diff --name-only 85730b47cabbb34110b46e2b748440bbd96fb260 099f567f2ded830cd102f6e594a9a497b23cbfc2 | wc -l)" -eq 6
      - name: Install isolated local review model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Review complete pinned file patches
        shell: bash
        run: |
          set -euo pipefail
          for part in 1 2; do
            REVIEW_PART="$part" python3 tools/offline_pr34_review.py
            test -s "review-$part.md"
            test -s "review-$part.json"
            test "$(cat review-head-$part.txt)" = "099f567f2ded830cd102f6e594a9a497b23cbfc2"
          done
      - name: Retain raw review and model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr34-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Submit verified independent model COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download complete model review
        uses: actions/download-artifact@v4
        with:
          name: independent-pr34-review
      - name: Verify changed files, model evidence and unchanged PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/34 --jq '.head.sha')"
          test "$actual" = "099f567f2ded830cd102f6e594a9a497b23cbfc2"
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_head = "099f567f2ded830cd102f6e594a9a497b23cbfc2"
          expected_files = {
              "src/Libraries/HeroSSID.Credentials/CredentialVerification/OfflineCredentialVerifier.cs",
              "src/Libraries/HeroSSID.Credentials/HeroSSID.Credentials.csproj",
              "tests/Unit/HeroSSID.Credentials.Tests/OfflineCredentialVerifierTests.cs",
              "tests/Unit/HeroSSID.Credentials.Tests/HeroSSID.Credentials.Tests.csproj",
              "docs/offline-credential-verification.md",
              "README.md",
          }
          seen = set()
          for part in (1, 2):
              payload = json.loads(Path(f"review-{part}.json").read_text())
              assert payload["head"] == expected_head
              assert payload["part"] == part
              files = set(payload["files"])
              assert files and files.isdisjoint(seen)
              seen.update(files)
              assert payload["review"]["verdict"] in (
                  "no_actionable_findings", "actionable_findings", "inconclusive"
              )
              assert Path(f"review-model-{part}.json").stat().st_size > 20
              assert Path(f"review-{part}.md").stat().st_size > 200
          assert seen == expected_files
          PY
      - name: Publish COMMENTED review (not APPROVED)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent local Qwen2.5-Coder 7B automated code review of PR #34.'
            echo
            echo 'Exact source: 099f567f2ded830cd102f6e594a9a497b23cbfc2. Baseline: 85730b47cabbb34110b46e2b748440bbd96fb260.'
            echo 'This is NOT human approval, an external audit or independent wallet conformance.'
            echo 'Investigate every finding against the actual source and tests before merge.'
            echo
            cat review-1.md
            echo
            cat review-2.md
            echo
          } > /tmp/pr34-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/34/reviews \
            -f event=COMMENT -f commit_id="099f567f2ded830cd102f6e594a9a497b23cbfc2" \
            -f body="$(cat /tmp/pr34-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
