name: Independent PR98 guardian recovery challenge security review

on:
  push:
    branches:
      - review/pr98-guardian-http-20261102

permissions: {}

jobs:
  review:
    name: Independent Qwen complete five-file exact-head review
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout helper and all immutable Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact candidate, base and four changed paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 9e3f8f0145e76d026768d06f23e0e70cf5a28ee2^{commit})" = "9e3f8f0145e76d026768d06f23e0e70cf5a28ee2"
          test "$(git rev-parse b78ccc29d73f934836674b42c525163d408b2d38^{commit})" = "b78ccc29d73f934836674b42c525163d408b2d38"
          git diff --name-only b78ccc29d73f934836674b42c525163d408b2d38 9e3f8f0145e76d026768d06f23e0e70cf5a28ee2 | sort >/tmp/review-files.txt
          python3 - <<'PY'
          from pathlib import Path
          paths = set(Path("/tmp/review-files.txt").read_text().splitlines())
          expected = {
              "README.md",
              "docs/issuer-guardian-recovery-challenges.md",
              "src/Services/HeroSSID.Api/Features/Credentials/CredentialEndpoints.cs",
              "src/Services/HeroSSID.Api/Features/Credentials/IssuerGuardianRecoveryHttpEndpoints.cs",
              "tests/Integration/HeroSSID.Integration.Tests/IssuerGuardianRecoveryHttpIntegrationTests.cs",
          }
          assert paths == expected, (paths, expected)
          PY
      - name: Install genuine independent Qwen2.5-Coder model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Independently audit every patch in three exhaustive partitions
        shell: bash
        run: |
          set -euo pipefail
          for part in 1 2 3; do
            REVIEW_PART="$part" python3 tools/offline_pr98_review.py
            test -s "review-$part.json"
            test -s "review-model-$part.json"
            test -s "review-$part.md"
            test "$(cat "review-head-$part.txt")" = "9e3f8f0145e76d026768d06f23e0e70cf5a28ee2"
          done
      - name: Preserve complete original model inference and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr98-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          retention-days: 30
          if-no-files-found: warn

  publish:
    name: Submit authentic COMMENTED model review against exact PR head
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Download original model results
        uses: actions/download-artifact@v4
        with:
          name: independent-pr98-review
      - name: Verify live PR head, entire five-file diff and original output
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/98 --jq '.head.sha')"
          test "$actual" = "9e3f8f0145e76d026768d06f23e0e70cf5a28ee2"
          gh api repos/KoalaFacts/HeroSSID/pulls/98/files --paginate --jq '.[].filename' | sort >/tmp/pr98-files.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          head = "9e3f8f0145e76d026768d06f23e0e70cf5a28ee2"
          expected = {
              "README.md",
              "docs/issuer-guardian-recovery-challenges.md",
              "src/Services/HeroSSID.Api/Features/Credentials/CredentialEndpoints.cs",
              "src/Services/HeroSSID.Api/Features/Credentials/IssuerGuardianRecoveryHttpEndpoints.cs",
              "tests/Integration/HeroSSID.Integration.Tests/IssuerGuardianRecoveryHttpIntegrationTests.cs",
          }
          assert set(Path("/tmp/pr98-files.txt").read_text().splitlines()) == expected
          all_files = []
          for part in (1, 2, 3):
              data = json.loads(Path(f"review-{part}.json").read_text())
              raw = json.loads(Path(f"review-model-{part}.json").read_text())
              assert data["head"] == head and data["part"] == part
              assert data["review"]["verdict"] == raw["verdict"]
              assert raw["verdict"] in ("no_actionable_findings", "actionable_findings", "inconclusive")
              assert len(Path(f"review-{part}.md").read_text()) > 150
              assert Path(f"review-head-{part}.txt").read_text().strip() == head
              all_files.extend(data["files"])
          assert len(all_files) == len(expected) and set(all_files) == expected
          PY
      - name: Submit one truthful independently generated COMMENTED review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "Independent Qwen2.5-Coder 7B local-model review of all five exact PR #98 patches."
            echo
            echo "Reviewed exact HEAD: 9e3f8f0145e76d026768d06f23e0e70cf5a28ee2. Base: b78ccc29d73f934836674b42c525163d408b2d38."
            echo "This is automated independent code review, NOT human approval, external security audit, wallet interoperability, W3C conformance, real-world identity verification or business authorization."
            echo "Model verdicts and every finding are preserved verbatim; each requires evidence-based disposition before any merge."
            echo
            cat review-1.md
            echo
            cat review-2.md
            echo
            cat review-3.md
          } >/tmp/pr98-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/98/reviews \
            -f event=COMMENT -f commit_id=9e3f8f0145e76d026768d06f23e0e70cf5a28ee2 \
            -f body="$(cat /tmp/pr98-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
