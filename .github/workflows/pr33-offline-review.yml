name: One-off independent offline PR33 review
on:
  push:
    branches:
      - review/pr33-offline-20261029

permissions: {}

jobs:
  review:
    name: Independent model review of complete PR33 patch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout immutable helper and pinned candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pinned source and baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse c482bc467a7a312d51c7f201522581f59009444b^{commit})" = "c482bc467a7a312d51c7f201522581f59009444b"
          test "$(git rev-parse 249883503b76c48559ff70c8a6e3265a05eef11a^{commit})" = "249883503b76c48559ff70c8a6e3265a05eef11a"
          test "$(git diff --name-only 249883503b76c48559ff70c8a6e3265a05eef11a c482bc467a7a312d51c7f201522581f59009444b | wc -l)" -eq 11
      - name: Install isolated local review model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Review complete pinned file patches
        shell: bash
        run: |
          set -euo pipefail
          for part in 1 2; do
            REVIEW_PART="$part" python3 tools/offline_pr33_review.py
            test -s "review-$part.md"
            test -s "review-$part.json"
            test "$(cat review-head-$part.txt)" = "c482bc467a7a312d51c7f201522581f59009444b"
          done
      - name: Retain raw review and model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr33-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Submit verified independent model COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download complete model review
        uses: actions/download-artifact@v4
        with:
          name: independent-pr33-review
      - name: Verify changed files, model evidence and unchanged PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/33 --jq '.head.sha')"
          test "$actual" = "c482bc467a7a312d51c7f201522581f59009444b"
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_head = "c482bc467a7a312d51c7f201522581f59009444b"
          expected_files = {
              "src/Libraries/HeroSSID.Credentials/CredentialRevocation/IssuerRevocationSnapshot.cs",
              "tests/Unit/HeroSSID.Credentials.Tests/IssuerRevocationSnapshotTests.cs",
              "src/Services/HeroSSID.Api/Features/Credentials/IssuerRevocationSnapshotService.cs",
              "tests/Contract/HeroSSID.OpenID4VC.Contract.Tests/IssuerRevocationSnapshotHttpTests.cs",
              "src/Services/HeroSSID.Api/Features/Credentials/CredentialEndpoints.cs",
              "src/Services/HeroSSID.Api/Features/Credentials/CredentialRequests.cs",
              "src/Services/HeroSSID.Api/Features/Credentials/CredentialResponses.cs",
              "src/Services/HeroSSID.Api/Program.cs",
              "README.md",
              "src/Services/HeroSSID.Api/HeroSSID.Api.http",
              "docs/revocation-snapshot-profile.md",
          }
          seen = set()
          for part in (1, 2):
              payload = json.loads(Path(f"review-{part}.json").read_text())
              assert payload["head"] == expected_head
              assert payload["part"] == part
              files = set(payload["files"])
              assert files and files.isdisjoint(seen)
              seen.update(files)
              assert payload["review"]["verdict"] in (
                  "no_actionable_findings", "actionable_findings", "inconclusive"
              )
              assert Path(f"review-model-{part}.json").stat().st_size > 20
              assert Path(f"review-{part}.md").stat().st_size > 200
          assert seen == expected_files
          PY
      - name: Publish COMMENTED review (not APPROVED)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent local Qwen2.5-Coder 7B automated code review of PR #33.'
            echo
            echo 'Exact source: c482bc467a7a312d51c7f201522581f59009444b. Baseline: 249883503b76c48559ff70c8a6e3265a05eef11a.'
            echo 'This is NOT human approval, an external audit or independent wallet conformance.'
            echo 'Investigate every finding against the actual source and tests before merge.'
            echo
            cat review-1.md
            echo
            cat review-2.md
          } > /tmp/pr33-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/33/reviews \
            -f event=COMMENT -f commit_id="c482bc467a7a312d51c7f201522581f59009444b" \
            -f body="$(cat /tmp/pr33-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
