name: Independent PR112 host-pinned VC2 issuer status security review

on:
  push:
    branches:
      - review/pr112-vc2-status-cutoff-20261102

permissions: {}

jobs:
  review:
    name: Independent Qwen six-file host-owned VC2 signed-status cutoff review
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout helper and immutable Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact product HEAD, main baseline and all six paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 9a5b587f94c4f670bf6bad92e8210399302f95c8^{commit})" = "9a5b587f94c4f670bf6bad92e8210399302f95c8"
          test "$(git rev-parse 30a0367b3376f833b977424861aff5ac2c5a993e^{commit})" = "30a0367b3376f833b977424861aff5ac2c5a993e"
          git diff --name-only 30a0367b3376f833b977424861aff5ac2c5a993e 9a5b587f94c4f670bf6bad92e8210399302f95c8 | sort >/tmp/review-files.txt
          python3 - <<'PY'
          from pathlib import Path
          expected = {
              "src/Libraries/HeroSSID.Credentials/Vcdm20/Vcdm20VerifierDenylist.cs",
              "src/Services/HeroSSID.Api/Features/Credentials/HostPinnedVcdm20TrustedIssuerVerificationEndpoint.cs",
              "tests/Unit/HeroSSID.Api.Tests/HostPinnedVcdm20VerificationTests.cs",
              "tests/Unit/HeroSSID.Credentials.Tests/Vcdm20VerifierDenylistTests.cs",
              "docs/vcdm20-host-trusted-issuer-http.md",
              "README.md",
          }
          assert set(Path("/tmp/review-files.txt").read_text().splitlines()) == expected
          PY
      - name: Install independent Qwen2.5-Coder model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Independently audit every changed file in two exhaustive partitions
        shell: bash
        run: |
          set -euo pipefail
          for part in 1 2; do
            REVIEW_PART="$part" python3 tools/offline_pr112_review.py
            test -s "review-$part.json"
            test -s "review-model-$part.json"
            test -s "review-$part.md"
            test "$(cat "review-head-$part.txt")" = "9a5b587f94c4f670bf6bad92e8210399302f95c8"
          done
      - name: Preserve raw model inference, exact-head proofs and rendered review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr112-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          retention-days: 30
          if-no-files-found: warn

  publish:
    name: Submit authentic COMMENTED model review against exact PR112 head
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Download independent complete model results
        uses: actions/download-artifact@v4
        with:
          name: independent-pr112-review
      - name: Verify live PR head, full six-file set and original inference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/112 --jq '.head.sha')"
          test "$actual" = "9a5b587f94c4f670bf6bad92e8210399302f95c8"
          gh api repos/KoalaFacts/HeroSSID/pulls/112/files --paginate --jq '.[].filename' | sort >/tmp/pr112-files.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          head = "9a5b587f94c4f670bf6bad92e8210399302f95c8"
          expected = {
              "src/Libraries/HeroSSID.Credentials/Vcdm20/Vcdm20VerifierDenylist.cs",
              "src/Services/HeroSSID.Api/Features/Credentials/HostPinnedVcdm20TrustedIssuerVerificationEndpoint.cs",
              "tests/Unit/HeroSSID.Api.Tests/HostPinnedVcdm20VerificationTests.cs",
              "tests/Unit/HeroSSID.Credentials.Tests/Vcdm20VerifierDenylistTests.cs",
              "docs/vcdm20-host-trusted-issuer-http.md",
              "README.md",
          }
          assert set(Path("/tmp/pr112-files.txt").read_text().splitlines()) == expected
          all_files = []
          for part in (1, 2):
              data = json.loads(Path(f"review-{part}.json").read_text())
              raw = json.loads(Path(f"review-model-{part}.json").read_text())
              assert data["head"] == head and data["part"] == part
              assert (data["review"]["verdict"] == raw["verdict"] or
                      (raw["verdict"] == "no_actionable_findings" and
                       data["review"]["verdict"] == "inconclusive" and
                       bool(raw["findings"])))
              assert raw["verdict"] in ("no_actionable_findings", "actionable_findings", "inconclusive")
              assert len(Path(f"review-{part}.md").read_text()) > 150
              assert Path(f"review-head-{part}.txt").read_text().strip() == head
              all_files.extend(data["files"])
          assert len(all_files) == len(expected) and set(all_files) == expected
          PY
      - name: Submit truthful independently generated COMMENTED review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "Independent Qwen2.5-Coder 7B local-model review of all six exact PR #112 verifier-owned signed-status incident-cutoff patches."
            echo
            echo "Reviewed exact HEAD: 9a5b587f94c4f670bf6bad92e8210399302f95c8. Base: 30a0367b3376f833b977424861aff5ac2c5a993e."
            echo "Automated independent code review only; NOT human approval, an external cryptographic security audit, W3C conformance, third-party Wallet interoperability, personal identity validation or business authorization."
            echo "All authentic raw model verdicts and findings retained; each finding requires evidence-based disposition."
            echo
            cat review-1.md
            echo
            cat review-2.md
            echo
            echo
          } >/tmp/pr112-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/112/reviews \
            -f event=COMMENT -f commit_id=9a5b587f94c4f670bf6bad92e8210399302f95c8 \
            -f body="$(cat /tmp/pr112-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
