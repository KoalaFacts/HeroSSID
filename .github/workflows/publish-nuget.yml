name: Release and Publish NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Determine and validate version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="$DISPATCH_VERSION"
          fi

          # Deliberately strict NuGet SemVer 2 subset: exactly three numeric
          # components and optional prerelease identifiers; no metadata.
          # Reject newlines, metacharacters, output-file injection and
          # ambiguous/noncanonical package versions before downstream jobs.
          if (( ${#VERSION} > 128 )) ||
             [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid release version; expected 1.2.3 or 1.2.3-preview.1 (max 128 characters)."
            exit 1
          fi
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'Validated package version: %s\n' "$VERSION"

  build:
    name: Build
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for versioning

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: dotnet build --configuration Release --no-restore "/p:Version=$PACKAGE_VERSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/bin/Release/**
            **/obj/Release/**
          retention-days: 1

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: dotnet build --configuration Release --no-restore "/p:Version=$PACKAGE_VERSION"

      - name: Run all tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
          retention-days: 7

  security-scan:
    name: Security Scan
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run dependency vulnerability scan
        shell: bash
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
          if grep -q "has the following vulnerable packages" vulnerability-report.txt; then
            echo "::error::Vulnerable packages detected! Release blocked."
            cat vulnerability-report.txt
            exit 1
          fi
          echo "No vulnerable packages detected."

      - name: Run security analysis
        shell: bash
        run: |
          dotnet build HeroSSID.sln --configuration Release --no-incremental --disable-build-servers -m:1 \
            -p:EnableSecurityScan=true 2>&1 | tee security-scan.log

      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            vulnerability-report.txt
            **/obj/security-scan.sarif
            security-scan.log
          retention-days: 90

  release:
    name: Package NuGet Libraries
    needs: [version, security-scan]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: dotnet build --configuration Release --no-restore "/p:Version=$PACKAGE_VERSION"

      - name: Pack HeroSSID.Core
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet pack src/Libraries/HeroSSID.Core/HeroSSID.Core.csproj \
            --configuration Release \
            --no-build \
            --output ./packages \
            "/p:PackageVersion=$PACKAGE_VERSION"

      - name: Pack HeroSSID.DidOperations
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet pack src/Libraries/HeroSSID.DidOperations/HeroSSID.DidOperations.csproj \
            --configuration Release \
            --no-build \
            --output ./packages \
            "/p:PackageVersion=$PACKAGE_VERSION"

      - name: Pack HeroSSID.Credentials
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet pack src/Libraries/HeroSSID.Credentials/HeroSSID.Credentials.csproj \
            --configuration Release \
            --no-build \
            --output ./packages \
            "/p:PackageVersion=$PACKAGE_VERSION"

      - name: Pack HeroSSID.Data
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet pack src/Libraries/HeroSSID.Data/HeroSSID.Data.csproj \
            --configuration Release \
            --no-build \
            --output ./packages \
            "/p:PackageVersion=$PACKAGE_VERSION"

      - name: Pack HeroSSID.Observability
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet pack src/Libraries/HeroSSID.Observability/HeroSSID.Observability.csproj \
            --configuration Release \
            --no-build \
            --output ./packages \
            "/p:PackageVersion=$PACKAGE_VERSION"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./packages/*.nupkg
          retention-days: 30

  publish:
    name: Publish to NuGet.org
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production  # Require manual approval for production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./packages

      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      - name: Publish to NuGet.org using Trusted Publishing
        run: |
          dotnet nuget push "./packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: Create release summary
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          printf '## Published Packages - Version %s\n' "$PACKAGE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following packages have been published to NuGet.org:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -1 ./packages/*.nupkg | xargs -I {} basename {} | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
