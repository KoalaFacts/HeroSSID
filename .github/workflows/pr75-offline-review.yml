name: Independent exact-head PR75 VC2 explicit issuer trust review

on:
  push:
    branches:
      - review/pr75-vc2-http-trusted-issuers-20261031

permissions: {}

jobs:
  review:
    name: Independent model review of complete six-file VC2 issuer allowlist patch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout pinned candidate and helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable candidate and complete six-file diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 9b9c0175571a6db935c6db41ed98dea38f50089a^{commit})" = "9b9c0175571a6db935c6db41ed98dea38f50089a"
          test "$(git rev-parse 3e7a46dbabb6b6082df7a057f6f69b2d26f9afbb^{commit})" = "3e7a46dbabb6b6082df7a057f6f69b2d26f9afbb"
          test "$(git diff --name-only 3e7a46dbabb6b6082df7a057f6f69b2d26f9afbb 9b9c0175571a6db935c6db41ed98dea38f50089a | wc -l)" -eq 6
      - name: Install local independent review model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Independently examine all six source test and documentation patches
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_PART=1 python3 tools/offline_pr75_review.py
          test -s review-1.md
          test -s review-1.json
          test -s review-model-1.json
          test "$(cat review-head-1.txt)" = "9b9c0175571a6db935c6db41ed98dea38f50089a"
      - name: Retain independent raw review and exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr75-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Submit independent exact-head COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download independent model artifacts
        uses: actions/download-artifact@v4
        with:
          name: independent-pr75-review
      - name: Confirm source HEAD and all six files received model review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/75 --jq '.head.sha')"
          test "$actual" = "9b9c0175571a6db935c6db41ed98dea38f50089a"
          python3 - <<'PY'
          import json
          from pathlib import Path
          head = "9b9c0175571a6db935c6db41ed98dea38f50089a"
          expected = {
            "README.md",
            "docs/vcdm20-http-verify-profile.md",
            "src/Libraries/HeroSSID.Credentials/CredentialVerification/OfflineCredentialVerifier.cs",
            "src/Services/HeroSSID.Api/Features/Credentials/CredentialEndpoints.cs",
            "src/Services/HeroSSID.Api/Features/Credentials/Vcdm20TrustedIssuerVerificationEndpoint.cs",
            "tests/Unit/HeroSSID.Api.Tests/Vcdm20TrustedIssuerVerificationEndpointTests.cs",
          }
          result = json.loads(Path("review-1.json").read_text())
          raw = json.loads(Path("review-model-1.json").read_text())
          assert result["head"] == head and result["part"] == 1
          assert result["review"]["verdict"] == raw["verdict"]
          assert raw["verdict"] in ("no_actionable_findings", "actionable_findings", "inconclusive")
          assert set(result["files"]) == expected and len(result["files"]) == len(expected)
          assert len(Path("review-1.md").read_text()) > 200
          assert Path("review-head-1.txt").read_text().strip() == head
          PY
      - name: Publish actual independent findings, not human approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent Qwen2.5-Coder 7B security/code review of ALL six changed PR #75 VC2 issuer trust files.'
            echo
            echo 'Reviewed exact head: 9b9c0175571a6db935c6db41ed98dea38f50089a.'
            echo 'Baseline: 3e7a46dbabb6b6082df7a057f6f69b2d26f9afbb.'
            echo 'A submitted independent MODEL review, not human approval or cryptographic certification.'
            echo 'Every finding must be reconciled with actual source/tests before merge.'
            echo
            cat review-1.md
          } > /tmp/pr75-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/75/reviews \
            -f event=COMMENT -f commit_id=9b9c0175571a6db935c6db41ed98dea38f50089a \
            -f body="$(cat /tmp/pr75-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
