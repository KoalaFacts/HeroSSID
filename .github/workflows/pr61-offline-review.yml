name: Independent exact-head PR61 issuer-key successor HTTP review

on:
  push:
    branches:
      - review/pr61-issuer-successor-20261031

permissions: {}

jobs:
  review:
    name: Independent model security review of complete PR61 issuer-key successor patch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout pinned candidate and helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable source and complete changed-file set
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse f43763a40a786acb5757de320e67933a8f7fd43d^{commit})" = "f43763a40a786acb5757de320e67933a8f7fd43d"
          test "$(git rev-parse 4ce57561fceaec02deab410912eac3980c498a3d^{commit})" = "4ce57561fceaec02deab410912eac3980c498a3d"
          test "$(git diff --name-only 4ce57561fceaec02deab410912eac3980c498a3d f43763a40a786acb5757de320e67933a8f7fd43d | wc -l)" -eq 5
      - name: Install independent local model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Independently inspect all five changed source, test and documentation patches
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_PART=1 python3 tools/offline_pr61_review.py
          test -s review-1.md
          test -s review-1.json
          test -s review-model-1.json
          test "$(cat review-head-1.txt)" = "f43763a40a786acb5757de320e67933a8f7fd43d"
      - name: Retain raw model artifact and exact-head provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr61-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Submit exact-head independent COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download raw review and structured findings
        uses: actions/download-artifact@v4
        with:
          name: independent-pr61-review
      - name: Verify PR head, independent finding format and all changed files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/61 --jq '.head.sha')"
          test "$actual" = "f43763a40a786acb5757de320e67933a8f7fd43d"
          python3 - <<'PY'
          import json
          from pathlib import Path
          head = "f43763a40a786acb5757de320e67933a8f7fd43d"
          expected = {
            "README.md",
            "docs/issuer-key-successor-http-profile.md",
            "src/Services/HeroSSID.Api/Features/Credentials/CredentialEndpoints.cs",
            "src/Services/HeroSSID.Api/Features/Credentials/IssuerSuccessorEndpoints.cs",
            "tests/Integration/HeroSSID.Integration.Tests/IssuerSuccessorHttpIntegrationTests.cs",
          }
          result = json.loads(Path("review-1.json").read_text())
          raw = json.loads(Path("review-model-1.json").read_text())
          assert result["head"] == head and result["part"] == 1
          assert set(result["files"]) == expected and len(result["files"]) == len(expected)
          assert result["review"]["verdict"] == raw["verdict"]
          assert raw["verdict"] in ("no_actionable_findings", "actionable_findings", "inconclusive")
          assert len(Path("review-1.md").read_text()) > 200
          assert Path("review-head-1.txt").read_text().strip() == head
          PY
      - name: Submit independent model review, never claim human approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent Qwen2.5-Coder 7B security/code review of all five changed PR #61 issuer-key successor HTTP files.'
            echo
            echo 'Reviewed exact head: f43763a40a786acb5757de320e67933a8f7fd43d.'
            echo 'Baseline: 4ce57561fceaec02deab410912eac3980c498a3d.'
            echo 'This is a submitted independent MODEL review, not human approval or external cryptographic certification.'
            echo 'All findings require explicit source/test verification before merge.'
            echo
            cat review-1.md
          } > /tmp/pr61-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/61/reviews \
            -f event=COMMENT -f commit_id=f43763a40a786acb5757de320e67933a8f7fd43d \
            -f body="$(cat /tmp/pr61-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
