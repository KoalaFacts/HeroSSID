name: Independent PR143 wallet request_uri Activity privacy review

on:
  push:
    branches:
      - review/pr143-wallet-request-uri-20261104

permissions: {}

jobs:
  review:
    name: Independently review complete exact-head two-file security patch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout review helper and immutable product commits
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require precise reviewed commit, baseline and complete changed-file set
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 640a146af2ad7bef1475585a27025450409f3f1a^{commit})" = "640a146af2ad7bef1475585a27025450409f3f1a"
          test "$(git rev-parse 966894e98c9637871b4b6b91e00fea98ea75551b^{commit})" = "966894e98c9637871b4b6b91e00fea98ea75551b"
          git diff --name-only 966894e98c9637871b4b6b91e00fea98ea75551b 640a146af2ad7bef1475585a27025450409f3f1a | sort >/tmp/review-files.txt
          python3 - <<'PY'
          from pathlib import Path
          expected = {"src/Libraries/HeroSSID.Credentials/VerifiablePresentations/OpenId4VpJwtVcJsonRequestUri.cs", "tests/Unit/HeroSSID.Credentials.Tests/OpenId4VpJwtVcJsonRequestUriTests.cs"}
          assert set(Path("/tmp/review-files.txt").read_text().splitlines()) == expected
          PY
      - name: Install independent Qwen2.5-Coder 7B inference engine
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Run independent model across both complete changed files
        shell: bash
        run: |
          set -euo pipefail
          for part in 1 2; do
            REVIEW_PART="$part" python3 tools/offline_pr143_review.py
            test -s "review-$part.md"
            test -s "review-model-$part.json"
            test "$(cat "review-head-$part.txt")" = "640a146af2ad7bef1475585a27025450409f3f1a"
          done
      - name: Keep raw independent model verdicts and source coverage proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr143-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          retention-days: 30
          if-no-files-found: warn

  publish:
    name: Submit genuine independent exact-head COMMENTED review to PR143
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Read saved independent inference artifacts
        uses: actions/download-artifact@v4
        with:
          name: independent-pr143-review
      - name: Verify live PR143 head and raw model coverage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/KoalaFacts/HeroSSID/pulls/143 --jq '.head.sha')" = "640a146af2ad7bef1475585a27025450409f3f1a"
          gh api repos/KoalaFacts/HeroSSID/pulls/143/files --paginate --jq '.[].filename' | sort >/tmp/actual-files.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {"src/Libraries/HeroSSID.Credentials/VerifiablePresentations/OpenId4VpJwtVcJsonRequestUri.cs", "tests/Unit/HeroSSID.Credentials.Tests/OpenId4VpJwtVcJsonRequestUriTests.cs"}
          head = "640a146af2ad7bef1475585a27025450409f3f1a"
          assert set(Path("/tmp/actual-files.txt").read_text().splitlines()) == expected
          reviewed = []
          for part in (1, 2):
              data = json.loads(Path(f"review-{part}.json").read_text())
              raw = json.loads(Path(f"review-model-{part}.json").read_text())
              assert data["head"] == head and data["part"] == part
              assert raw["verdict"] in ("no_actionable_findings", "actionable_findings", "inconclusive")
              assert data["review"]["verdict"] == raw["verdict"] or (
                  raw["verdict"] == "no_actionable_findings" and
                  data["review"]["verdict"] == "inconclusive" and raw["findings"])
              assert Path(f"review-head-{part}.txt").read_text().strip() == head
              assert len(Path(f"review-{part}.md").read_text()) > 120
              reviewed += data["files"]
          assert set(reviewed) == expected and len(reviewed) == 2
          PY
      - name: Publish authentic model observations as COMMENTED review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "Independent Qwen2.5-Coder 7B review of the complete PR #143 trace-isolation patch."
            echo "Exact reviewed head: 640a146af2ad7bef1475585a27025450409f3f1a; base: 966894e98c9637871b4b6b91e00fea98ea75551b."
            echo "Automated independent review, not human approval, external security audit, third-party wallet interop, personal identity verification or business authorization."
            echo "Original model conclusions and findings are preserved; each finding requires disposition."
            echo
            cat review-1.md
            echo
            cat review-2.md
          } >/tmp/pr143-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/143/reviews \
            -f event=COMMENT -f commit_id=640a146af2ad7bef1475585a27025450409f3f1a \
            -f body="$(cat /tmp/pr143-review.md)" --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
