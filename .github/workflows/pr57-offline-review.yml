name: Publish completed independent PR57 review

on:
  push:
    branches:
      - review/pr57-jwtvc-http-20261031

permissions: {}

jobs:
  publish:
    name: Submit exact-head independent COMMENTED review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Reuse completed independent model artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41080599142 --repo KoalaFacts/HeroSSID \
            --name independent-pr57-review --dir .
          test -s review-1.json
          test -s review-model-1.json
          test -s review-1.md
      - name: Verify pinned source, artifact provenance and full review coverage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/57 --jq '.head.sha')"
          test "$actual" = "731945f074587569376ae4995824b3feb90e3c29"
          artifact_digest="$(gh api repos/KoalaFacts/HeroSSID/actions/artifacts/12990970282 --jq '.digest')"
          test "$artifact_digest" = "sha256:bfb7952317bd3cf37a7bdcd3515c7b04b947bb066bcff4fa4e159342cd03a81e"
          gh api repos/KoalaFacts/HeroSSID/actions/runs/41080599142/jobs \
            --jq '.jobs[] | select(.name=="Independent model review of complete PR57 patch") | .conclusion' \
            | grep -qx success
          python3 - <<'PY'
          import json
          from pathlib import Path
          head = "731945f074587569376ae4995824b3feb90e3c29"
          expected = {
            "README.md",
            "docs/jwt-vc-json-http-issue-profile.md",
            "src/Services/HeroSSID.Api/Features/Credentials/CredentialEndpoints.cs",
            "src/Services/HeroSSID.Api/Features/Credentials/JwtVcJsonCredentialIssuanceEndpoint.cs",
            "tests/Contract/HeroSSID.OpenID4VC.Contract.Tests/JwtVcJsonCredentialIssuanceHttpTests.cs",
          }
          payload = json.loads(Path("review-1.json").read_text())
          raw = json.loads(Path("review-model-1.json").read_text())
          assert payload["head"] == head and payload["part"] == 1
          assert set(payload["files"]) == expected and len(payload["files"]) == len(expected)
          assert raw["verdict"] in ("no_actionable_findings", "actionable_findings", "inconclusive")
          assert payload["review"]["verdict"] == raw["verdict"]
          assert len(Path("review-1.md").read_text()) > 200
          assert Path("review-head-1.txt").read_text().strip() == head
          PY
      - name: Submit independent COMMENTED review to the correct PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent Qwen2.5-Coder 7B security review of all five changed PR #57 files.'
            echo
            echo 'Reviewed head: 731945f074587569376ae4995824b3feb90e3c29.'
            echo 'Baseline: a7d1dc118cff9907e4d9a58756d3d385e2141e0e.'
            echo 'This is a submitted independent MODEL review, NOT human approval or external cryptography audit.'
            echo 'All findings require verification against source and tests before merging.'
            echo
            cat review-1.md
          } > /tmp/pr57-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/57/reviews \
            -f event=COMMENT \
            -f commit_id=731945f074587569376ae4995824b3feb90e3c29 \
            -f body="$(cat /tmp/pr57-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
