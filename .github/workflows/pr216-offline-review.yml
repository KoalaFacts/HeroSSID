name: Publish exact-head independent PR216 model review artifact
on:
  push:
    branches:
      - review/pr216-offline-20261107

permissions: {}

jobs:
  publish:
    name: Submit verified independent model COMMENTED review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download complete model review
        uses: actions/download-artifact@v4
        with:
          name: independent-pr216-review
          run-id: 42308988461
          github-token: ${{ github.token }}
      - name: Verify changed files, model evidence and unchanged PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/216 --jq '.head.sha')"
          test "$actual" = "e7c7f24725c2094d25b930a96ca3895a767cb8be"
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_head = "e7c7f24725c2094d25b930a96ca3895a767cb8be"
          expected_files = {
              "docs/jwt-vc-json-pinned-didweb-presentation-denylist.md",
              "src/Libraries/HeroSSID.Credentials/JwtVcJson/JwtVcJsonPinnedDidWebPresentationDenylist.cs",
              "tests/Unit/HeroSSID.Credentials.Tests/JwtVcJsonPinnedDidWebPresentationDenylistTests.cs",
          }
          seen = set()
          for part in (1, 2):
              payload = json.loads(Path(f"review-{part}.json").read_text())
              assert payload["head"] == expected_head
              assert payload["part"] == part
              files = set(payload["files"])
              assert files and files.isdisjoint(seen)
              seen.update(files)
              assert payload["review"]["verdict"] in (
                  "no_actionable_findings", "actionable_findings", "inconclusive"
              )
              assert Path(f"review-model-{part}.json").stat().st_size > 20
              assert Path(f"review-{part}.md").stat().st_size > 200
          assert seen == expected_files
          PY
      - name: Publish COMMENTED review (not APPROVED)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent local Qwen2.5-Coder 7B automated code review of PR #216.'
            echo
            echo 'Exact source: e7c7f24725c2094d25b930a96ca3895a767cb8be. Baseline: 221bfc1fb95dda4f99e64433e0ad74a629c6558b.'
            echo 'This is NOT human approval, an external audit or independent wallet conformance.'
            echo 'Investigate every finding against the actual source and tests before merge.'
            echo
            cat review-1.md
            echo
            cat review-2.md
            echo
          } > /tmp/pr216-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/216/reviews \
            -f event=COMMENT -f commit_id="e7c7f24725c2094d25b930a96ca3895a767cb8be" \
            -f body="$(cat /tmp/pr216-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
