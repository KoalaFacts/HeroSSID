name: One-off independent offline PR49 review
on:
  push:
    branches:
      - review/pr49-offline-20261030

permissions: {}

jobs:
  review:
    name: Independent model review of complete PR49 patch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout immutable helper and pinned candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pinned source and baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 8ad64ca2a612b6509da7fe71c5800faef55b540e^{commit})" = "8ad64ca2a612b6509da7fe71c5800faef55b540e"
          test "$(git rev-parse ba6ae7b228a8584367090b0e4eedec840dba9650^{commit})" = "ba6ae7b228a8584367090b0e4eedec840dba9650"
          test "$(git diff --name-only ba6ae7b228a8584367090b0e4eedec840dba9650 8ad64ca2a612b6509da7fe71c5800faef55b540e | wc -l)" -eq 4
      - name: Install isolated local review model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Review complete pinned file patches
        shell: bash
        run: |
          set -euo pipefail
          for part in 1; do
            REVIEW_PART="$part" python3 tools/offline_pr49_review.py
            test -s "review-$part.md"
            test -s "review-$part.json"
            test "$(cat review-head-$part.txt)" = "8ad64ca2a612b6509da7fe71c5800faef55b540e"
          done
      - name: Retain raw review and model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr49-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Submit verified independent model COMMENTED review
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download complete model review
        uses: actions/download-artifact@v4
        with:
          name: independent-pr49-review
      - name: Verify changed files, model evidence and unchanged PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/49 --jq '.head.sha')"
          test "$actual" = "8ad64ca2a612b6509da7fe71c5800faef55b540e"
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected_head = "8ad64ca2a612b6509da7fe71c5800faef55b540e"
          expected_files = {"README.md", "docs/vcdm20-http-status-verify-profile.md", "src/Services/HeroSSID.Api/Features/Credentials/Vcdm20CredentialVerificationEndpoint.cs", "tests/Contract/HeroSSID.OpenID4VC.Contract.Tests/Vcdm20CredentialStatusVerificationHttpTests.cs"}
          seen = set()
          for part in (1,):
              payload = json.loads(Path(f"review-{part}.json").read_text())
              assert payload["head"] == expected_head
              assert payload["part"] == part
              files = set(payload["files"])
              assert files and files.isdisjoint(seen)
              seen.update(files)
              assert payload["review"]["verdict"] in (
                  "no_actionable_findings", "actionable_findings", "inconclusive"
              )
              assert Path(f"review-model-{part}.json").stat().st_size > 20
              assert Path(f"review-{part}.md").stat().st_size > 200
          assert seen == expected_files
          PY
      - name: Publish COMMENTED review (not APPROVED)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent local Qwen2.5-Coder 7B automated code review of PR #49.'
            echo
            echo 'Exact source: 8ad64ca2a612b6509da7fe71c5800faef55b540e. Baseline: ba6ae7b228a8584367090b0e4eedec840dba9650.'
            echo 'This is NOT human approval, an external audit or independent wallet conformance.'
            echo 'Investigate every finding against the actual source and tests before merge.'
            echo
            cat review-1.md
            echo
            echo
          } > /tmp/pr49-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/49/reviews \
            -f event=COMMENT -f commit_id="8ad64ca2a612b6509da7fe71c5800faef55b540e" \
            -f body="$(cat /tmp/pr49-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
