name: Independent PR84 verifier-owned exact-JWT denylist review

on:
  push:
    branches:
      - review/pr84-verifier-denylist-20261101

permissions: {}

jobs:
  review:
    name: Independent Qwen review of four emergency-denylist patches
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout pinned candidate and helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable candidate and complete four-file diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 15da529cd8a71eb572b375a331431c0503c38ca0^{commit})" = "15da529cd8a71eb572b375a331431c0503c38ca0"
          test "$(git rev-parse 006dee9a21c6d24821afc3096a7371f443baa7a2^{commit})" = "006dee9a21c6d24821afc3096a7371f443baa7a2"
          test "$(git diff --name-only 006dee9a21c6d24821afc3096a7371f443baa7a2 15da529cd8a71eb572b375a331431c0503c38ca0 | wc -l)" -eq 4
      - name: Install local independent code review model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 </dev/null &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:7b
      - name: Review part 1 of 2 (real source patches, not a mock)
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_PART=1 python3 tools/offline_pr84_review.py
          test -s review-1.md
          test -s review-1.json
          test -s review-model-1.json
          test "$(cat review-head-1.txt)" = "15da529cd8a71eb572b375a331431c0503c38ca0"
      - name: Review part 2 of 2 (full remaining source patches)
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_PART=2 python3 tools/offline_pr84_review.py
          test -s review-2.md
          test -s review-2.json
          test -s review-model-2.json
          test "$(cat review-head-2.txt)" = "15da529cd8a71eb572b375a331431c0503c38ca0"
      - name: Retain independent raw model results and exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-pr84-review
          path: |
            review-*.md
            review-*.json
            review-head-*.txt
            review-model-*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Submit independent exact-head COMMENTED review, not approval
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download actual independent model artifacts
        uses: actions/download-artifact@v4
        with:
          name: independent-pr84-review
      - name: Verify exact head and that all four changed files were inspected
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/KoalaFacts/HeroSSID/pulls/84 --jq '.head.sha')"
          test "$actual" = "15da529cd8a71eb572b375a331431c0503c38ca0"
          python3 - <<'PY'
          import json
          from pathlib import Path
          head = "15da529cd8a71eb572b375a331431c0503c38ca0"
          expected = {
            "README.md",
            "docs/jwt-vc-json-verifier-emergency-denylist.md",
            "src/Libraries/HeroSSID.Credentials/JwtVcJson/JwtVcJsonVerifierDenylist.cs",
            "tests/Unit/HeroSSID.Credentials.Tests/JwtVcJsonVerifierDenylistTests.cs",
          }
          seen = []
          for part in (1, 2):
              data = json.loads(Path(f"review-{part}.json").read_text())
              raw = json.loads(Path(f"review-model-{part}.json").read_text())
              assert data["head"] == head and data["part"] == part
              assert data["review"]["verdict"] == raw["verdict"]
              assert raw["verdict"] in ("no_actionable_findings", "actionable_findings", "inconclusive")
              assert len(Path(f"review-{part}.md").read_text()) > 200
              assert Path(f"review-head-{part}.txt").read_text().strip() == head
              seen.extend(data["files"])
          assert len(seen) == len(expected) and set(seen) == expected, (seen, expected)
          PY
      - name: Submit model's actual verdicts and findings to GitHub PR84
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo 'Independent Qwen2.5-Coder 7B security/code review of ALL FOUR changed PR #84 verifier-owned exact-JWT emergency-denial files.'
            echo
            echo 'Reviewed exact source head: 15da529cd8a71eb572b375a331431c0503c38ca0.'
            echo 'Baseline: 006dee9a21c6d24821afc3096a7371f443baa7a2.'
            echo 'Model execution, NOT human approval, independent wallet conformance or external cryptographic certification.'
            echo 'Every finding requires itemized source/test reconciliation before merge.'
            echo
            cat review-1.md
            echo
            cat review-2.md
          } >/tmp/pr84-independent-review.md
          gh api --method POST repos/KoalaFacts/HeroSSID/pulls/84/reviews \
            -f event=COMMENT -f commit_id=15da529cd8a71eb572b375a331431c0503c38ca0 \
            -f body="$(cat /tmp/pr84-independent-review.md)" \
            --jq '{id: .id, state: .state, submitted_at: .submitted_at}'
